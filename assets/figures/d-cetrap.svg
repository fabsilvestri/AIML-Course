<svg width="1080" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
  </defs>

  <text class="t-hd" x="40" y="34" fill="#0b3d62">What the last layer hands to the loss</text>

  <!-- the shared starting point -->
  <rect class="box" x="40" y="150" width="176" height="70" rx="7"/>
  <text class="t" x="128" y="180" text-anchor="middle">logits  z</text>
  <text class="t-sub" x="128" y="203" text-anchor="middle">any real numbers</text>

  <!-- the right path -->
  <path class="flow" d="M 216 168 L 300 118" stroke="#14663a" marker-end="url(#ag)"/>
  <rect class="box-g" x="308" y="82" width="330" height="70" rx="7"/>
  <text class="t" x="473" y="112" text-anchor="middle" fill="#14663a">CrossEntropyLoss(z, y)</text>
  <text class="t-sub" x="473" y="135" text-anchor="middle">log-softmax and NLL, in one kernel</text>

  <path class="flow" d="M 638 117 L 740 117" stroke="#14663a" marker-end="url(#ag)"/>
  <rect class="box-g" x="748" y="82" width="292" height="70" rx="7"/>
  <text class="t" x="894" y="112" text-anchor="middle" fill="#14663a">one scalar loss</text>
  <text class="t-sub" x="894" y="135" text-anchor="middle">the max never overflows</text>

  <!-- the wrong path -->
  <path class="flow" d="M 216 202 L 300 252" stroke="#c0392b"
        stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <rect class="box-r" x="308" y="222" width="176" height="70" rx="7"/>
  <text class="t" x="396" y="252" text-anchor="middle" fill="#c0392b">softmax(z)</text>
  <text class="t-sub" x="396" y="275" text-anchor="middle">probabilities</text>

  <path class="flow" d="M 484 257 L 552 257" stroke="#c0392b"
        stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <rect class="box-r" x="560" y="222" width="330" height="70" rx="7"/>
  <text class="t" x="725" y="252" text-anchor="middle" fill="#c0392b">CrossEntropyLoss(p, y)</text>
  <text class="t-sub" x="725" y="275" text-anchor="middle">softmax applied a second time</text>

  <text class="t-sub" x="308" y="316" fill="#c0392b">It runs. It trains. The gradient is squashed toward zero, and nothing raises.</text>

  <!-- the gradient, which is why the right path exists -->
  <rect class="box-m" x="40" y="340" width="1000" height="76" rx="7"/>
  <text class="t" x="62" y="372" fill="#6c3483">On the green path only:&#160;&#160; &#8706;L / &#8706;z &#160;=&#160; softmax(z) &#8722; y</text>
  <text class="t-sub" x="62" y="398">prediction minus target, with every exponential cancelled before it is ever formed</text>
</svg>
