<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text x="16" y="30" font-size="19" font-weight="700" fill="#0b3d62">Your model is one component in a data pipeline</text>
  <text x="16" y="54" font-size="15.5" fill="#6b7280">Components are self-contained and communicate only through data stores. Nobody upstream knows how you work.</text>

  <!-- upstream -->
  <rect x="16" y="86" width="196" height="88" rx="8" fill="#f7f8f9" stroke="#6b7280" stroke-width="2"/>
  <text x="114" y="118" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6b7280">upstream</text>
  <text x="114" y="140" text-anchor="middle" font-size="14.5" fill="#6b7280">district data</text>
  <text x="114" y="159" text-anchor="middle" font-size="14.5" fill="#6b7280">collection</text>

  <!-- store 1 -->
  <path d="M 232 96 h 96 a 14 14 0 0 1 0 22 v 46 a 14 14 0 0 1 -96 0 v -46 a 14 14 0 0 1 0 -22 z"
        fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <ellipse cx="280" cy="107" rx="48" ry="11" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="280" y="148" text-anchor="middle" font-size="14.5" fill="#0b3d62">housing.csv</text>

  <!-- our component -->
  <rect x="348" y="80" width="234" height="100" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="3.5"/>
  <text x="465" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3d62">your component</text>
  <text x="465" y="134" text-anchor="middle" font-size="15" fill="#16212b">predict a district&#8217;s</text>
  <text x="465" y="153" text-anchor="middle" font-size="15" fill="#16212b">median house value</text>
  <text x="465" y="172" text-anchor="middle" font-size="13.5" fill="#c0392b" font-weight="700">this is all you build</text>

  <!-- store 2 -->
  <path d="M 602 96 h 96 a 14 14 0 0 1 0 22 v 46 a 14 14 0 0 1 -96 0 v -46 a 14 14 0 0 1 0 -22 z"
        fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <ellipse cx="650" cy="107" rx="48" ry="11" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="650" y="148" text-anchor="middle" font-size="14.5" fill="#0b3d62">predictions</text>

  <!-- downstream -->
  <rect x="718" y="86" width="196" height="88" rx="8" fill="#f7f8f9" stroke="#6b7280" stroke-width="2"/>
  <text x="816" y="118" text-anchor="middle" font-size="16.5" font-weight="700" fill="#6b7280">downstream</text>
  <text x="816" y="140" text-anchor="middle" font-size="14.5" fill="#6b7280">investment</text>
  <text x="816" y="159" text-anchor="middle" font-size="14.5" fill="#6b7280">analysis system</text>

  <!-- decision -->
  <rect x="932" y="86" width="132" height="88" rx="8" fill="#fdf1ef" stroke="#c0392b" stroke-width="2"/>
  <text x="998" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">invest,</text>
  <text x="998" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">or not</text>

  <!-- arrows -->
  <g stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#s-ar)">
    <path d="M 214 130 L 230 130"/>
    <path d="M 330 130 L 344 130"/>
    <path d="M 584 130 L 600 130"/>
    <path d="M 700 130 L 714 130"/>
    <path d="M 916 130 L 928 130"/>
  </g>

  <!-- consequences -->
  <rect x="16" y="212" width="516" height="140" rx="9" fill="#fdf1ef" stroke="#c0392b" stroke-width="2.5"/>
  <text x="274" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#c0392b">What this framing buys you</text>
  <text x="36" y="268" font-size="15.5" fill="#16212b">· A broken component does not crash the pipeline —</text>
  <text x="48" y="288" font-size="15.5" fill="#16212b">  downstream keeps reading the last output it saw</text>
  <text x="36" y="314" font-size="15.5" fill="#16212b">· So a silently wrong model can run for months</text>
  <text x="36" y="338" font-size="15.5" font-weight="700" fill="#c0392b">· Monitoring is not optional. It is the component.</text>

  <rect x="548" y="212" width="516" height="140" rx="9" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
  <text x="806" y="240" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0b3d62">What the framing tells you to ask</text>
  <text x="568" y="268" font-size="15.5" fill="#16212b">· What does downstream actually <tspan font-style="italic">do</tspan> with the number?</text>
  <text x="568" y="292" font-size="15.5" fill="#16212b">· What is the current solution, and how good is it?</text>
  <text x="568" y="316" font-size="15.5" fill="#16212b">· What error would change the downstream decision?</text>
  <text x="568" y="340" font-size="15.5" font-weight="700" fill="#0b3d62">· Only then: which model?</text>
</svg>
