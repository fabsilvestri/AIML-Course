<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="bt-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text x="16" y="30" class="t-hd" fill="#0b3d62">Ten classes in, two classes out</text>
  <text x="16" y="54" class="t-sub">The split is given to us. The relabelling is ours, and it is where the imbalance is created.</text>

  <rect x="16" y="88" width="196" height="96" rx="7" class="box"/>
  <text x="114" y="122" class="t" text-anchor="middle" font-weight="700">MNIST</text>
  <text x="114" y="146" class="t-sub" text-anchor="middle">70,000 images</text>
  <text x="114" y="168" class="t-sub" text-anchor="middle">784 pixels, 0–255</text>

  <path d="M 212 136 L 264 136" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>

  <rect x="268" y="72" width="196" height="62" rx="7" class="box"/>
  <text x="366" y="97" class="t" text-anchor="middle" font-weight="700">first 60,000 rows</text>
  <text x="366" y="120" class="t-sub" text-anchor="middle">the training set</text>

  <rect x="268" y="146" width="196" height="62" rx="7" class="box"/>
  <text x="366" y="171" class="t" text-anchor="middle" font-weight="700">last 10,000 rows</text>
  <text x="366" y="194" class="t-sub" text-anchor="middle">the test set — untouched</text>

  <path d="M 464 103 L 524 103" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>

  <rect x="528" y="60" width="230" height="86" rx="7" class="box-r"/>
  <text x="643" y="86" class="t" text-anchor="middle" font-weight="700" fill="#c0392b">relabel: y == 5</text>
  <text x="643" y="110" class="t-sub" text-anchor="middle">5,421 positive</text>
  <text x="643" y="132" class="t-sub" text-anchor="middle">54,579 negative</text>

  <path d="M 758 103 L 818 103" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>

  <rect x="822" y="52" width="242" height="102" rx="7" class="box"/>
  <text x="943" y="78" class="t" text-anchor="middle" font-weight="700">Pipeline</text>
  <text x="943" y="102" class="t-sub" text-anchor="middle">StandardScaler</text>
  <text x="943" y="124" class="t-sub" text-anchor="middle">SGDClassifier</text>
  <text x="943" y="146" class="t-sub" text-anchor="middle">one object, refitted per fold</text>

  <path d="M 943 154 L 943 208" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>
  <rect x="806" y="212" width="258" height="62" rx="7" class="box"/>
  <text x="935" y="237" class="t" text-anchor="middle" font-weight="700">3-fold cross-validation</text>
  <text x="935" y="260" class="t-sub" text-anchor="middle">stratified, shuffled, seed 42</text>

  <path d="M 806 243 L 704 243" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>
  <rect x="444" y="212" width="256" height="62" rx="7" class="box-g"/>
  <text x="572" y="237" class="t" text-anchor="middle" font-weight="700" fill="#14663a">three held-out accuracies</text>
  <text x="572" y="260" class="t-sub" text-anchor="middle">report all three, not the mean alone</text>

  <path d="M 444 243 L 344 243" stroke="#0b3d62" class="flow" marker-end="url(#bt-ar)"/>
  <rect x="16" y="212" width="324" height="62" rx="7" class="box-r"/>
  <text x="178" y="237" class="t" text-anchor="middle" font-weight="700" fill="#c0392b">compare against 90.96%</text>
  <text x="178" y="260" class="t-sub" text-anchor="middle">the detector that never fires</text>
</svg>
