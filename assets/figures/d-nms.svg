<svg width="1080" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="30" fill="#16212b">Non-maximum suppression, greedily</text>

  <!-- before -->
  <text class="t-sub" x="14" y="62" fill="#4b5563">candidates, sorted by score</text>
  <rect x="30" y="80" width="170" height="150" rx="7" fill="none"
        stroke="#0b3d62" stroke-width="3"/>
  <text class="t-sub" x="36" y="100" fill="#0b3d62">0.98</text>
  <rect x="52" y="94" width="170" height="150" rx="7" fill="none"
        stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t-sub" x="180" y="262" fill="#c0392b">0.91</text>
  <rect x="14" y="108" width="170" height="150" rx="7" fill="none"
        stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t-sub" x="20" y="278" fill="#c0392b">0.86</text>
  <rect x="250" y="150" width="140" height="120" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <text class="t-sub" x="256" y="170" fill="#14663a">0.77</text>

  <line class="flow" x1="410" y1="170" x2="470" y2="170" stroke="#0b3d62"
        marker-end="url(#an)"/>

  <!-- the rule -->
  <rect class="box" x="482" y="76" width="300" height="188" rx="7"/>
  <text class="t" x="500" y="108">The algorithm</text>
  <text class="t-sub" x="500" y="136">1 · take the highest-scoring box</text>
  <text class="t-sub" x="500" y="160">2 · discard every remaining box</text>
  <text class="t-sub" x="524" y="184">of the same class whose IoU</text>
  <text class="t-sub" x="524" y="208">with it exceeds a threshold</text>
  <text class="t-sub" x="500" y="234">3 · repeat on what is left</text>

  <line class="flow" x1="790" y1="170" x2="850" y2="170" stroke="#0b3d62"
        marker-end="url(#an)"/>

  <!-- after -->
  <text class="t-sub" x="866" y="62" fill="#4b5563">what survives</text>
  <rect x="880" y="80" width="120" height="110" rx="7" fill="none"
        stroke="#0b3d62" stroke-width="3"/>
  <text class="t-sub" x="886" y="100" fill="#0b3d62">0.98</text>
  <rect x="920" y="180" width="100" height="90" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <text class="t-sub" x="926" y="200" fill="#14663a">0.77</text>

  <rect class="box-r" x="14" y="298" width="1052" height="88" rx="7"/>
  <text class="t" x="34" y="330" fill="#c0392b">The cost, stated plainly</text>
  <text class="t-sub" x="34" y="360">Two genuinely different objects that overlap heavily — one person in front of another — are one box after suppression.</text>
  <text class="t-sub" x="34" y="380">The threshold buys precision with recall, and it is a number nobody in the room chose.</text>
</svg>
