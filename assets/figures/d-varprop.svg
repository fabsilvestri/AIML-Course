<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
  </marker>
  <marker id="ag2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
  </marker>
  <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>

  <!-- the one recursion -->
  <rect class="box-m" x="290" y="10" width="500" height="76" rx="7"/>
  <text class="t-hd" x="540" y="42" text-anchor="middle" fill="#6c3483">one linear layer, one recursion</text>
  <text class="t" x="540" y="70" text-anchor="middle">Var(z) = n &#183; Var(w) &#183; Var(x)</text>

  <path class="flow" stroke="#6c3483" marker-end="url(#am)" d="M 400 86 L 260 132"/>
  <path class="flow" stroke="#6c3483" marker-end="url(#am)" d="M 680 86 L 820 132"/>

  <!-- forward branch -->
  <rect class="box-g" x="40" y="138" width="440" height="112" rx="7"/>
  <text class="t-hd" x="60" y="168" fill="#14663a">Forward</text>
  <text class="t-sub" x="60" y="192">keep the activation spread constant as it descends</text>
  <text class="t" x="60" y="220">n&#8202;&#8339; &#183; Var(w) = 1</text>
  <text class="t" x="290" y="220" fill="#14663a">Var(w) = 1 / n&#8202;&#8339;</text>
  <text class="t-sub" x="60" y="240">n&#8202;&#8339; is the fan-in: how many numbers arrive</text>

  <!-- backward branch -->
  <rect class="box-r" x="600" y="138" width="440" height="112" rx="7"/>
  <text class="t-hd" x="620" y="168" fill="#c0392b">Backward</text>
  <text class="t-sub" x="620" y="192">keep the gradient spread constant as it climbs</text>
  <text class="t" x="620" y="220">n&#8202;&#8338; &#183; Var(w) = 1</text>
  <text class="t" x="850" y="220" fill="#c0392b">Var(w) = 1 / n&#8202;&#8338;</text>
  <text class="t-sub" x="620" y="240">n&#8202;&#8338; is the fan-out: how many numbers leave</text>

  <path class="flow" stroke="#14663a" marker-end="url(#ag2)" d="M 260 250 L 420 296"/>
  <path class="flow" stroke="#c0392b" marker-end="url(#ar2)" d="M 820 250 L 660 296"/>

  <!-- the conflict -->
  <rect class="box-m" x="240" y="302" width="600" height="104" rx="7"/>
  <text class="t-hd" x="540" y="332" text-anchor="middle" fill="#6c3483">Both, unless n&#8202;&#8339; = n&#8202;&#8338;</text>
  <text class="t" x="540" y="362" text-anchor="middle">Glorot: Var(w) = 2 / (n&#8202;&#8339; + n&#8202;&#8338;)</text>
  <text class="t-sub" x="540" y="390" text-anchor="middle">the harmonic compromise &#8212; He doubles it, because ReLU discards half the variance</text>
</svg>
