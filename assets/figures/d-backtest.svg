<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
    .tr    { fill:#cbd8e2; stroke:#0b3d62; stroke-width:1.4; }
    .te    { fill:#14663a; stroke:#0e4d2b; stroke-width:1.4; }
    .un    { fill:#f4f7f9; stroke:#b0bcc7; stroke-width:1.2; }
  </style>
  <defs>
    <marker id="b-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="28" fill="#0b3d62">Backtesting: re-run the build at four origins</text>
  <text class="t-sub" x="14" y="52">Each row is a complete refit. Each score is a forecast of days the fit had not reached.</text>

  <!-- legend -->
  <g>
    <rect class="tr" x="640" y="38" width="26" height="18" rx="6"/>
    <text class="t-sub" x="674" y="52">fitted on</text>
    <rect class="te" x="770" y="38" width="26" height="18" rx="6"/>
    <text class="t-sub" x="804" y="52">scored on</text>
    <rect class="un" x="900" y="38" width="26" height="18" rx="6"/>
    <text class="t-sub" x="934" y="52">not yet available</text>
  </g>

  <!-- fold 1 -->
  <text class="t" x="186" y="98" text-anchor="end" font-weight="700" fill="#0b3d62">origin 1</text>
  <rect class="tr" x="200" y="74" width="283" height="32" rx="7"/>
  <rect class="te" x="485" y="74" width="140" height="32" rx="7"/>
  <rect class="un" x="627" y="74" width="423" height="32" rx="7"/>

  <!-- fold 2 -->
  <text class="t" x="186" y="146" text-anchor="end" font-weight="700" fill="#0b3d62">origin 2</text>
  <rect class="tr" x="200" y="122" width="425" height="32" rx="7"/>
  <rect class="te" x="627" y="122" width="140" height="32" rx="7"/>
  <rect class="un" x="769" y="122" width="281" height="32" rx="7"/>

  <!-- fold 3 -->
  <text class="t" x="186" y="194" text-anchor="end" font-weight="700" fill="#0b3d62">origin 3</text>
  <rect class="tr" x="200" y="170" width="567" height="32" rx="7"/>
  <rect class="te" x="769" y="170" width="140" height="32" rx="7"/>
  <rect class="un" x="911" y="170" width="139" height="32" rx="7"/>

  <!-- fold 4 -->
  <text class="t" x="186" y="242" text-anchor="end" font-weight="700" fill="#0b3d62">origin 4</text>
  <rect class="tr" x="200" y="218" width="709" height="32" rx="7"/>
  <rect class="te" x="911" y="218" width="139" height="32" rx="7"/>

  <!-- time axis -->
  <line x1="200" y1="272" x2="1050" y2="272" stroke="#4b5563" stroke-width="2.5"
        marker-end="url(#b-ar)"/>
  <text class="t-sub" x="1050" y="294" text-anchor="end">time</text>
  <text class="t-sub" x="200" y="294">start of the record</text>

  <rect class="box-g" x="14" y="312" width="640" height="94" rx="7"/>
  <text class="t" x="34" y="340" fill="#14663a" font-weight="700">What you get</text>
  <text class="t" x="34" y="364">Four out-of-sample scores instead of one, so you</text>
  <text class="t" x="34" y="388">can see the spread as well as the level.</text>

  <rect class="box-r" x="676" y="312" width="390" height="94" rx="7"/>
  <text class="t" x="696" y="340" fill="#c0392b" font-weight="700">What to watch</text>
  <text class="t" x="696" y="364">Origin 1 is fitted on a quarter of</text>
  <text class="t" x="696" y="388">the data. Its score is not comparable.</text>
</svg>
