<svg width="1080" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
  </defs>

  <!-- left: near -->
  <text class="t-hd" x="14" y="30" fill="#c0392b">Disjoint, close</text>
  <rect x="40" y="70" width="120" height="110" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <rect x="200" y="70" width="120" height="110" rx="7" fill="none"
        stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="40" y="70" width="280" height="110" rx="7" fill="#6c3483"
        opacity="0.12" stroke="#6c3483" stroke-width="2.5"/>
  <text class="t-sub" x="42" y="62" fill="#6c3483">C, the smallest box containing both</text>
  <text class="t" x="40" y="222" fill="#c0392b">IoU = 0</text>
  <text class="t" x="40" y="252" fill="#14663a">GIoU = −0.14</text>
  <text class="t-sub" x="40" y="284">the gap is small relative to C,</text>
  <text class="t-sub" x="40" y="306">so the penalty is small</text>

  <!-- right: far -->
  <text class="t-hd" x="560" y="30" fill="#c0392b">Disjoint, far</text>
  <rect x="580" y="70" width="120" height="110" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <rect x="920" y="70" width="120" height="110" rx="7" fill="none"
        stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="580" y="70" width="460" height="110" rx="7" fill="#6c3483"
        opacity="0.12" stroke="#6c3483" stroke-width="2.5"/>
  <text class="t" x="580" y="222" fill="#c0392b">IoU = 0, still</text>
  <text class="t" x="580" y="252" fill="#14663a">GIoU = −0.48</text>
  <text class="t-sub" x="580" y="284">C has grown, the gap has grown</text>
  <text class="t-sub" x="580" y="306">faster, and the penalty follows</text>

  <line x1="524" y1="20" x2="524" y2="356" stroke="#b0bcc7" stroke-width="2"
        stroke-dasharray="6 6"/>

  <text class="t" x="14" y="356" fill="#14663a">GIoU = IoU − area(C \ (A ∪ B)) / area(C)</text>
  <line class="flow" x1="470" y1="350" x2="560" y2="350" stroke="#14663a"
        marker-end="url(#ag)"/>
  <text class="t-sub" x="580" y="356">one term that keeps moving where IoU has stopped</text>
</svg>
