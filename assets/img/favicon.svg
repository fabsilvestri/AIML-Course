<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Applications of Machine Learning">
  <title>Applications of Machine Learning</title>
  <!-- The course in one mark: three measurements, and the baseline they have to
       be read against. "A metric with nothing to compare it to is decoration."
       The leftmost bar sits exactly on the line - a result that beat nothing. -->
  <rect width="32" height="32" rx="7" fill="#0b3d62"/>
  <g fill="#f2f6f9">
    <rect x="6.5"  y="17.0" width="4.4" height="8.6"  rx="0.9"/>
    <rect x="13.9" y="12.3" width="4.4" height="13.3" rx="0.9"/>
    <rect x="21.3" y="7.6"  width="4.4" height="18.0" rx="0.9"/>
  </g>
  <line x1="4.4" y1="17" x2="27.6" y2="17" stroke="#e8776a" stroke-width="2"
        stroke-linecap="round"/>
</svg>
