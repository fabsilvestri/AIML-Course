<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="cg-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="cg-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <text class="t-hd" x="20" y="32" fill="#0b3d62">L = w&#178;,&#160; w = x&#183;y + sin x,&#160; at x = 2, y = 3</text>

  <!-- forward sweep banner -->
  <path class="flow" stroke="#0b3d62" marker-end="url(#cg-f)" d="M 40 66 L 1040 66"/>
  <text class="t-sub" x="46" y="58" fill="#0b3d62">forward pass &#8212; carries values, left to right, one sweep</text>

  <!-- nodes -->
  <rect x="46" y="120" width="104" height="62" rx="7" class="box"/>
  <text class="t" x="98" y="147" text-anchor="middle">x</text>
  <text class="t-sub" x="98" y="170" text-anchor="middle" fill="#0b3d62">2.0</text>

  <rect x="46" y="278" width="104" height="62" rx="7" class="box"/>
  <text class="t" x="98" y="305" text-anchor="middle">y</text>
  <text class="t-sub" x="98" y="328" text-anchor="middle" fill="#0b3d62">3.0</text>

  <rect x="264" y="98" width="140" height="62" rx="7" class="box"/>
  <text class="t" x="334" y="125" text-anchor="middle">s = sin x</text>
  <text class="t-sub" x="334" y="148" text-anchor="middle" fill="#0b3d62">0.9093</text>

  <rect x="264" y="290" width="140" height="62" rx="7" class="box"/>
  <text class="t" x="334" y="317" text-anchor="middle">u = x &#183; y</text>
  <text class="t-sub" x="334" y="340" text-anchor="middle" fill="#0b3d62">6.0</text>

  <rect x="516" y="192" width="150" height="62" rx="7" class="box"/>
  <text class="t" x="591" y="219" text-anchor="middle">w = u + s</text>
  <text class="t-sub" x="591" y="242" text-anchor="middle" fill="#0b3d62">6.9093</text>

  <rect x="780" y="192" width="130" height="62" rx="7" class="box-g"/>
  <text class="t" x="845" y="219" text-anchor="middle">L = w&#178;</text>
  <text class="t-sub" x="845" y="242" text-anchor="middle" fill="#14663a">47.7384</text>

  <!-- forward edges -->
  <g class="flow" stroke="#0b3d62" marker-end="url(#cg-f)">
    <path d="M 150 140 L 258 128"/>
    <path d="M 150 166 L 258 306"/>
    <path d="M 150 312 L 258 320"/>
    <path d="M 404 132 L 510 208"/>
    <path d="M 404 318 L 510 240"/>
    <path d="M 666 223 L 774 223"/>
  </g>

  <!-- reverse annotations -->
  <text class="t-sub" x="922" y="216" fill="#6c3483">seed</text>
  <text class="t-sub" x="922" y="238" fill="#6c3483">&#8706;L/&#8706;L = 1</text>

  <g stroke="#6c3483" stroke-width="2.5" fill="none" stroke-dasharray="7 5"
     marker-end="url(#cg-r)">
    <path d="M 774 246 L 668 246"/>
    <path d="M 510 258 L 406 336"/>
    <path d="M 510 190 L 406 150"/>
    <path d="M 258 344 L 152 336"/>
    <path d="M 258 336 L 152 192"/>
    <path d="M 258 106 L 152 118"/>
  </g>

  <text class="t-sub" x="672" y="282" fill="#6c3483">&#8706;L/&#8706;w = 2w = 13.8186</text>
  <text class="t-sub" x="414" y="372" fill="#6c3483">&#8706;L/&#8706;u = (&#8706;L/&#8706;w)&#183;1</text>
  <text class="t-sub" x="414" y="394" fill="#6c3483">= 13.8186</text>
  <text class="t-sub" x="418" y="128" fill="#6c3483">&#8706;L/&#8706;s = (&#8706;L/&#8706;w)&#183;1</text>
  <text class="t-sub" x="418" y="106" fill="#6c3483">= 13.8186</text>

  <text class="t-sub" x="160" y="372" fill="#6c3483">&#8706;L/&#8706;y = (&#8706;L/&#8706;u)&#183;x = 27.6372</text>
  <rect x="152" y="212" width="212" height="50" rx="4" fill="#ffffff" opacity="0.9"/>
  <text class="t-sub" x="160" y="230" fill="#6c3483">via &#215;:&#160; (&#8706;L/&#8706;u)&#183;y = +41.4557</text>
  <text class="t-sub" x="160" y="252" fill="#6c3483">via sin: (&#8706;L/&#8706;s)&#183;cos x = &#8722;5.7505</text>

  <rect x="46" y="404" width="470" height="72" rx="7" class="box-m"/>
  <text class="t" x="66" y="432" fill="#6c3483">&#8706;L/&#8706;x = 41.4557 &#8722; 5.7505 = 35.7053</text>
  <text class="t-sub" x="66" y="460">x is used twice, so its adjoint is a <tspan font-style="italic">sum</tspan> over outgoing edges</text>

  <rect x="546" y="404" width="488" height="72" rx="7" class="box-g"/>
  <text class="t" x="566" y="432" fill="#14663a">One reverse sweep &#8594; both derivatives</text>
  <text class="t-sub" x="566" y="460">Forward mode would need two sweeps here: one seeded at x, one at y</text>

  <!-- reverse sweep banner -->
  <path class="flow" stroke="#6c3483" marker-end="url(#cg-r)" stroke-dasharray="7 5"
        d="M 1040 512 L 40 512"/>
  <text class="t-sub" x="600" y="540" fill="#6c3483" text-anchor="middle">reverse pass &#8212; carries adjoints &#8706;L/&#8706;(node), right to left, one sweep per <tspan font-style="italic">output</tspan></text>
</svg>
