<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="b-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- ============ A · BUILD ============ -->
  <rect x="16" y="52" width="76" height="86" rx="7" fill="#0b3d62"/>
  <text x="54" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">A</text>
  <text x="54" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#9fc4dd" letter-spacing="1">BUILD</text>

  <text x="104" y="42" font-size="16" fill="#4b5563">0 min</text>
  <text x="1064" y="42" text-anchor="end" font-size="16" fill="#4b5563">90 min</text>

  <!-- proportional blocks: 15 / 15 / 60 of 90 -->
  <rect x="104" y="52" width="160" height="86" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="184" y="82" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">15 min</text>
  <text x="184" y="104" text-anchor="middle" font-size="19" fill="#33414d">the problem,</text>
  <text x="184" y="123" text-anchor="middle" font-size="19" fill="#33414d">data, stakeholder</text>

  <rect x="268" y="52" width="160" height="86" rx="7" fill="#fffdf7" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="348" y="82" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">15 min</text>
  <text x="348" y="104" text-anchor="middle" font-size="19" fill="#c0392b">choose a metric,</text>
  <text x="348" y="123" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">commit a number</text>

  <rect x="432" y="52" width="632" height="86" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="748" y="82" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">60 min</text>
  <text x="748" y="106" text-anchor="middle" font-size="19" fill="#33414d">build the simplest thing that runs</text>
  <text x="748" y="127" text-anchor="middle" font-size="19" fill="#4b5563">everyone leaves with a number they are pleased with</text>

  <!-- ============ the hinge ============ -->
  <path d="M 348 142 C 348 186 348 186 348 214" stroke="#c0392b" stroke-width="3"
        fill="none" marker-end="url(#b-ar)"/>
  <rect x="386" y="158" width="500" height="42" rx="7" fill="#fdf1ef" stroke="#c0392b" stroke-width="2"/>
  <text x="636" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">
    the written commitment is what makes the next lecture land
  </text>

  <!-- ============ B · FIX ============ -->
  <rect x="16" y="222" width="76" height="86" rx="7" fill="#14663a"/>
  <text x="54" y="258" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">B</text>
  <text x="54" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#b7e3ca" letter-spacing="1">FIX</text>

  <!-- 20 / 20 / 35 / 15 of 90 -->
  <rect x="104" y="222" width="213" height="86" rx="7" fill="#f6f0f9" stroke="#6c3483" stroke-width="2.5"/>
  <text x="210" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#6c3483">20 min</text>
  <text x="210" y="275" text-anchor="middle" font-size="19" font-weight="700" fill="#6c3483">mathematical thread</text>
  <text x="210" y="295" text-anchor="middle" font-size="16" fill="#6c3483">exactly one object</text>

  <rect x="321" y="222" width="213" height="86" rx="7" fill="#fdf1ef" stroke="#c0392b" stroke-width="2"/>
  <text x="427" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">20 min</text>
  <text x="427" y="275" text-anchor="middle" font-size="19" fill="#c0392b">diagnose why</text>
  <text x="427" y="295" text-anchor="middle" font-size="19" fill="#c0392b">the number was wrong</text>

  <rect x="538" y="222" width="373" height="86" rx="7" fill="#eff8f2" stroke="#14663a" stroke-width="2"/>
  <text x="724" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#14663a">35 min</text>
  <text x="724" y="277" text-anchor="middle" font-size="19" fill="#14663a">the method that repairs it</text>
  <text x="724" y="297" text-anchor="middle" font-size="16" fill="#4b5563">because you wanted it, not because a chapter said so</text>

  <rect x="915" y="222" width="149" height="86" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="989" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">15 min</text>
  <text x="989" y="275" text-anchor="middle" font-size="19" fill="#33414d">re-measure,</text>
  <text x="989" y="295" text-anchor="middle" font-size="19" fill="#33414d">red-team a peer</text>

  <!-- footer -->
  <text x="540" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">
    Twelve applications × two lectures = twenty-four lectures
  </text>
  <text x="540" y="378" text-anchor="middle" font-size="19" fill="#4b5563">
    You predicted. You were wrong. Now you want to know why.
  </text>
</svg>
