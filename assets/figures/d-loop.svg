<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- five steps -->
  <g>
    <!-- 1 Specify -->
    <rect x="12" y="78" width="188" height="112" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
    <text x="106" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">STEP 1</text>
    <text x="106" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3d62">Specify</text>
    <text x="106" y="166" text-anchor="middle" font-size="15" fill="#33414d">input · output</text>
    <text x="106" y="184" text-anchor="middle" font-size="15" fill="#33414d">constraint · check</text>

    <!-- 2 Generate -->
    <rect x="228" y="78" width="188" height="112" rx="8" fill="#f7f8f9" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="322" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">STEP 2</text>
    <text x="322" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#6b7280">Generate</text>
    <text x="322" y="166" text-anchor="middle" font-size="15" fill="#6b7280">the assistant writes</text>
    <text x="322" y="184" text-anchor="middle" font-size="15" fill="#6b7280">the code</text>

    <!-- 3 Read -->
    <rect x="444" y="78" width="188" height="112" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
    <text x="538" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">STEP 3</text>
    <text x="538" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3d62">Read</text>
    <text x="538" y="166" text-anchor="middle" font-size="15" fill="#33414d">as a reviewer,</text>
    <text x="538" y="184" text-anchor="middle" font-size="15" fill="#33414d">not as an author</text>

    <!-- 4 Test -->
    <rect x="660" y="78" width="188" height="112" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
    <text x="754" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">STEP 4</text>
    <text x="754" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3d62">Test</text>
    <text x="754" y="166" text-anchor="middle" font-size="15" fill="#33414d">against a case whose</text>
    <text x="754" y="184" text-anchor="middle" font-size="15" fill="#33414d">answer you know</text>

    <!-- 5 Verify -->
    <rect x="876" y="78" width="192" height="112" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
    <text x="972" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#6b7280" letter-spacing="1.5">STEP 5</text>
    <text x="972" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#0b3d62">Verify</text>
    <text x="972" y="166" text-anchor="middle" font-size="15" fill="#33414d">that the number means</text>
    <text x="972" y="184" text-anchor="middle" font-size="15" fill="#33414d">what it appears to</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#0b3d62" stroke-width="2.5" marker-end="url(#ar)" fill="none">
    <path d="M 202 134 L 224 134"/>
    <path d="M 418 134 L 440 134"/>
    <path d="M 634 134 L 656 134"/>
    <path d="M 850 134 L 872 134"/>
  </g>

  <!-- who does what -->
  <text x="106" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d62">you</text>
  <text x="322" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#6b7280">the assistant</text>
  <text x="646" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#0b3d62">you</text>
  <path d="M 444 46 L 1068 46" stroke="#0b3d62" stroke-width="1.5" opacity="0.35"/>
  <path d="M 12 46 L 200 46" stroke="#0b3d62" stroke-width="1.5" opacity="0.35"/>
  <path d="M 228 46 L 416 46" stroke="#6b7280" stroke-width="1.5" opacity="0.35"/>

  <!-- the stop -->
  <text x="322" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">…then STOP.</text>
  <text x="322" y="244" text-anchor="middle" font-size="15" fill="#c0392b">Do not run it yet.</text>

  <!-- feedback arrow -->
  <path d="M 972 196 L 972 292 L 106 292 L 106 196" stroke="#0b3d62" stroke-width="2.5"
        fill="none" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <rect x="336" y="276" width="460" height="32" rx="6" fill="#ffffff"/>
  <text x="566" y="298" text-anchor="middle" font-size="16" fill="#0b3d62">
    the number is wrong → sharpen the specification
  </text>

  <!-- emphasis band -->
  <rect x="444" y="70" width="624" height="128" rx="10" fill="none" stroke="#c0392b" stroke-width="2.5" opacity="0.85"/>
  <text x="756" y="332" text-anchor="middle" font-size="17" font-weight="700" fill="#c0392b">
    steps 3–5 are the course · step 2 is the part that is free
  </text>
</svg>
