<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#0b3d62"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#14663a"/>
    </marker>
  </defs>

  <!-- the patch -->
  <rect class="box" x="30" y="150" width="180" height="96" rx="7" style="fill:#eef4f8"/>
  <text class="t" x="120" y="180" text-anchor="middle">one patch</text>
  <text class="t-sub" x="120" y="206" text-anchor="middle">54 columns of</text>
  <text class="t-sub" x="120" y="226" text-anchor="middle">terrain measurements</text>

  <path class="flow" d="M 216 198 L 268 198" stroke="#0b3d62" marker-end="url(#a)"/>

  <!-- the path down the tree -->
  <rect class="box" x="278" y="40" width="330" height="46" rx="7"/>
  <text class="t" x="296" y="70">Elevation &gt; 3,046 m</text>

  <rect class="box" x="278" y="100" width="330" height="46" rx="7"/>
  <text class="t" x="296" y="130">Elevation &gt; 3,306 m</text>

  <rect class="box" x="278" y="160" width="330" height="46" rx="7"/>
  <text class="t" x="296" y="190">Wild_2 = 1  (it is in that wilderness area)</text>

  <text class="t-sub" x="620" y="238">four more conditions</text>

  <rect class="box" x="278" y="256" width="330" height="46" rx="7"/>
  <text class="t" x="296" y="286">Hillshade at noon ≤ 244</text>

  <path class="flow" d="M 443 90 L 443 96" stroke="#0b3d62" marker-end="url(#a)"/>
  <path class="flow" d="M 443 150 L 443 156" stroke="#0b3d62" marker-end="url(#a)"/>
  <path class="flow" d="M 443 210 L 443 216" stroke="#0b3d62" stroke-dasharray="6 5"/>
  <path class="flow" d="M 443 244 L 443 252" stroke="#0b3d62" marker-end="url(#a)"/>

  <!-- the leaf -->
  <path class="flow" d="M 614 279 L 666 279" stroke="#14663a" marker-end="url(#ag)"/>
  <rect class="box-g" x="676" y="248" width="374" height="62" rx="7" style="fill:#eaf3ee"/>
  <text class="t" x="696" y="278" fill="#14663a">leaf: Krummholz</text>
  <text class="t-sub" x="696" y="300">481 training patches, 90% of them Krummholz</text>

  <!-- what the regulator receives -->
  <rect class="box-g" x="676" y="40" width="374" height="170" rx="7"/>
  <text class="t-hd" x="696" y="72" fill="#14663a">What the regulator gets</text>
  <text class="t-sub" x="696" y="102">&#8220;Classified as Krummholz because the site</text>
  <text class="t-sub" x="696" y="124">lies above 3,360 m, is in wilderness area</text>
  <text class="t-sub" x="696" y="146">Wild_2, and is not on soil type 26 or 31. Of</text>
  <text class="t-sub" x="696" y="168">the 481 training sites meeting all eight</text>
  <text class="t-sub" x="696" y="190">conditions, 90% were Krummholz.&#8221;</text>

  <path class="flow" d="M 863 244 L 863 216" stroke="#14663a" marker-end="url(#ag)"/>
</svg>
