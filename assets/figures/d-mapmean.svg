<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="30" fill="#6c3483">mAP is a mean of a mean of an area</text>

  <!-- level 1: PR curve per (class, threshold) -->
  <rect class="box" x="14" y="56" width="238" height="120" rx="7"/>
  <text class="t" x="32" y="88">One class, one IoU t</text>
  <text class="t-sub" x="32" y="114">rank every detection by score,</text>
  <text class="t-sub" x="32" y="136">walk down it, record precision</text>
  <text class="t-sub" x="32" y="158">and recall at every step</text>

  <line class="flow" x1="260" y1="116" x2="304" y2="116" stroke="#6c3483"
        marker-end="url(#am)"/>

  <!-- level 2: AP -->
  <rect class="box-m" x="312" y="56" width="238" height="120" rx="7"/>
  <text class="t" x="330" y="88">AP — an area</text>
  <text class="t-sub" x="330" y="114">take the maximum precision at</text>
  <text class="t-sub" x="330" y="136">or above each recall, then the</text>
  <text class="t-sub" x="330" y="158">area under that envelope</text>

  <line class="flow" x1="558" y1="116" x2="602" y2="116" stroke="#6c3483"
        marker-end="url(#am)"/>

  <!-- level 3: mean over classes -->
  <rect class="box-m" x="610" y="56" width="230" height="120" rx="7"/>
  <text class="t" x="628" y="88">mean over classes</text>
  <text class="t-sub" x="628" y="114">mAP at that one t</text>
  <text class="t-sub" x="628" y="136">every class counts once,</text>
  <text class="t-sub" x="628" y="158">however rare it is</text>

  <line class="flow" x1="848" y1="116" x2="892" y2="116" stroke="#6c3483"
        marker-end="url(#am)"/>

  <!-- level 4: mean over thresholds -->
  <rect class="box-m" x="900" y="56" width="166" height="120" rx="7"/>
  <text class="t" x="918" y="88">mean over t</text>
  <text class="t-sub" x="918" y="114">t = 0.50, 0.55,</text>
  <text class="t-sub" x="918" y="136">… , 0.95</text>
  <text class="t-sub" x="918" y="158">one number</text>

  <!-- what each mean hides -->
  <rect class="box-r" x="14" y="230" width="330" height="164" rx="7"/>
  <text class="t" x="32" y="264" fill="#c0392b">The area hides</text>
  <text class="t-sub" x="32" y="292">where on the curve you are strong.</text>
  <text class="t-sub" x="32" y="316">Two detectors with the same AP can</text>
  <text class="t-sub" x="32" y="340">be useless at the recall you need.</text>
  <text class="t-sub" x="32" y="372">There is no operating point in here.</text>

  <rect class="box-r" x="368" y="230" width="330" height="164" rx="7"/>
  <text class="t" x="386" y="264" fill="#c0392b">The class mean hides</text>
  <text class="t-sub" x="386" y="292">how many instances each class had.</text>
  <text class="t-sub" x="386" y="316">A class with one instance scores</text>
  <text class="t-sub" x="386" y="340">1.0 or 0.0 and nothing between,</text>
  <text class="t-sub" x="386" y="372">and it weighs as much as any other.</text>

  <rect class="box-r" x="722" y="230" width="344" height="164" rx="7"/>
  <text class="t" x="740" y="264" fill="#c0392b">The threshold mean hides</text>
  <text class="t-sub" x="740" y="292">how tight the boxes are. A model</text>
  <text class="t-sub" x="740" y="316">that finds everything but localises</text>
  <text class="t-sub" x="740" y="340">loosely scores well at 0.50 and</text>
  <text class="t-sub" x="740" y="372">near zero at 0.95.</text>

  <line class="flow" x1="180" y1="180" x2="180" y2="224" stroke="#c0392b"
        marker-end="url(#ar)"/>
  <line class="flow" x1="500" y1="180" x2="500" y2="224" stroke="#c0392b"
        marker-end="url(#ar)"/>
  <line class="flow" x1="900" y1="180" x2="900" y2="224" stroke="#c0392b"
        marker-end="url(#ar)"/>
</svg>
