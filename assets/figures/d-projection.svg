<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="p-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="p-arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
  </defs>

  <!-- the column space -->
  <polygon points="120,290 620,290 780,410 280,410" fill="#f0e9f5" stroke="#6c3483" stroke-width="2.5"/>
  <text x="150" y="398" font-size="19" font-weight="700" fill="#6c3483">col(X)</text>
  <text x="150" y="420" font-size="14.5" fill="#6c3483">every vector Xθ lives in this plane</text>

  <!-- origin -->
  <circle cx="330" cy="350" r="6" fill="#16212b"/>
  <text x="306" y="345" text-anchor="end" font-size="17" font-weight="700" fill="#16212b">0</text>

  <!-- the two columns spanning the plane -->
  <path d="M 330 350 L 528 316" stroke="#6c3483" stroke-width="2.2" fill="none"
        marker-end="url(#p-arM)" opacity="0.85"/>
  <text x="540" y="312" font-size="16" fill="#6c3483" font-style="italic">x₁</text>
  <path d="M 330 350 L 420 396" stroke="#6c3483" stroke-width="2.2" fill="none"
        marker-end="url(#p-arM)" opacity="0.85"/>
  <text x="436" y="392" font-size="16" fill="#6c3483" font-style="italic">x₂</text>

  <!-- y : the labels, which do NOT lie in the plane -->
  <path d="M 330 350 L 620 164" stroke="#0b3d62" stroke-width="3.5" fill="none" marker-end="url(#p-ar)"/>
  <text x="452" y="230" font-size="20" font-weight="700" fill="#0b3d62" transform="rotate(-34 452 230)">y</text>
  <text x="626" y="150" font-size="15.5" fill="#0b3d62">the labels you were given</text>

  <!-- y-hat : the projection -->
  <path d="M 330 350 L 620 366" stroke="#0b3d62" stroke-width="3.5" fill="none" marker-end="url(#p-ar)"/>
  <text x="452" y="376" font-size="20" font-weight="700" fill="#0b3d62">Xθ̂</text>
  <text x="470" y="398" font-size="15" fill="#33414d">the best a linear model can do</text>

  <!-- the residual -->
  <path d="M 620 356 L 620 178" stroke="#c0392b" stroke-width="3.5" fill="none"
        stroke-dasharray="9 5" marker-end="url(#p-arA)"/>
  <text x="636" y="272" font-size="19" font-weight="700" fill="#c0392b">y − Xθ̂</text>
  <text x="636" y="294" font-size="15" fill="#c0392b">the residual</text>

  <!-- right angle -->
  <path d="M 620 356 L 598 356 L 598 334 L 620 334" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- the statement -->
  <rect x="60" y="34" width="840" height="86" rx="9" fill="#f6f0f9" stroke="#6c3483" stroke-width="2.5"/>
  <text x="480" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#6c3483">
    Xᵀ(Xθ̂ − y) = 0
  </text>
  <text x="480" y="92" text-anchor="middle" font-size="16.5" fill="#16212b">
    Read it row by row: the residual is orthogonal to <tspan font-weight="700">every column of X</tspan>.
  </text>
  <text x="480" y="112" text-anchor="middle" font-size="15.5" fill="#33414d">
    Least squares is not an algebraic trick — it is a projection onto col(X).
  </text>

  <!-- the consequence -->
  <rect x="60" y="440" width="840" height="50" rx="8" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="480" y="462" text-anchor="middle" font-size="16" fill="#16212b">
    If two columns are collinear the plane collapses to a line: the projection still exists,
  </text>
  <text x="480" y="482" text-anchor="middle" font-size="16" fill="#16212b">
    but θ̂ is no longer unique — which is exactly when XᵀX stops being invertible.
  </text>
</svg>
