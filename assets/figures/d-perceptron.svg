<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="pc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="pc-ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <text class="t-hd" x="20" y="34" fill="#0b3d62">One threshold logic unit — the perceptron&#8217;s only moving part</text>

  <!-- input nodes -->
  <circle cx="90"  cy="110" r="30" class="box"/>
  <circle cx="90"  cy="196" r="30" class="box"/>
  <circle cx="90"  cy="282" r="30" class="box"/>
  <circle cx="90"  cy="356" r="26" class="box" fill="#eef4f8"/>
  <text class="t" x="90" y="117" text-anchor="middle">x&#8321;</text>
  <text class="t" x="90" y="203" text-anchor="middle">x&#8322;</text>
  <text class="t" x="90" y="289" text-anchor="middle">x&#8323;</text>
  <text class="t" x="90" y="363" text-anchor="middle">1</text>
  <text class="t-sub" x="90" y="72" text-anchor="middle">inputs</text>
  <text class="t-sub" x="20" y="396">bias input, always 1</text>

  <!-- edges into the sum -->
  <path class="flow" stroke="#0b3d62" marker-end="url(#pc-ar)" d="M 120 110 L 388 186"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#pc-ar)" d="M 120 196 L 388 196"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#pc-ar)" d="M 120 282 L 388 208"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#pc-ar)" d="M 116 356 L 388 224"/>
  <text class="t-sub" x="240" y="132" fill="#6c3483">w&#8321;</text>
  <text class="t-sub" x="240" y="188" fill="#6c3483">w&#8322;</text>
  <text class="t-sub" x="240" y="256" fill="#6c3483">w&#8323;</text>
  <text class="t-sub" x="240" y="310" fill="#6c3483">b</text>

  <!-- the sum -->
  <rect x="392" y="150" width="200" height="100" rx="7" class="box-m"/>
  <text class="t" x="492" y="192" text-anchor="middle">weighted sum</text>
  <text class="t" x="492" y="224" text-anchor="middle" fill="#6c3483">z = w&#183;x + b</text>

  <path class="flow" stroke="#0b3d62" marker-end="url(#pc-ar)" d="M 592 200 L 656 200"/>

  <!-- the step -->
  <rect x="660" y="150" width="190" height="100" rx="7" class="box-r"/>
  <text class="t" x="755" y="186" text-anchor="middle">step function</text>
  <text class="t-sub" x="755" y="214" text-anchor="middle">1 if z &#8805; 0, else 0</text>
  <text class="t-sub" x="755" y="238" text-anchor="middle" fill="#c0392b">derivative 0 everywhere</text>

  <path class="flow" stroke="#c0392b" marker-end="url(#pc-ar-r)" d="M 850 200 L 916 200"/>

  <!-- output -->
  <circle cx="962" cy="200" r="34" class="box-r"/>
  <text class="t" x="962" y="207" text-anchor="middle">&#375;</text>
  <text class="t-sub" x="962" y="266" text-anchor="middle">a label, not a score</text>

  <!-- the verdict -->
  <text class="t-sub" x="392" y="304" fill="#c0392b">The step is why a perceptron cannot be trained by gradient descent, and</text>
  <text class="t-sub" x="392" y="326" fill="#c0392b">why it emits no probability. Replace it and the whole of Chapter 10 follows.</text>
</svg>
