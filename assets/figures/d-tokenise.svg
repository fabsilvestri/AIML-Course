<svg width="1080" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text class="t-hd" x="40" y="34" fill="#0b3d62">The plot was unwatchable and utterly discombobulating.</text>

  <text class="t-sub" x="40" y="76">our word tokenizer &#183; 20,000 words, ranked by frequency in the training split</text>
  <rect class="box" x="40" y="96" width="55" height="40" rx="7"/>
  <text class="t" x="68" y="122" text-anchor="middle" fill="#16212b">the</text>
  <rect class="box" x="104" y="96" width="64" height="40" rx="7"/>
  <text class="t" x="136" y="122" text-anchor="middle" fill="#16212b">plot</text>
  <rect class="box" x="177" y="96" width="55" height="40" rx="7"/>
  <text class="t" x="204" y="122" text-anchor="middle" fill="#16212b">was</text>
  <rect class="box" x="241" y="96" width="132" height="40" rx="7"/>
  <text class="t" x="307" y="122" text-anchor="middle" fill="#16212b">unwatchable</text>
  <rect class="box" x="382" y="96" width="55" height="40" rx="7"/>
  <text class="t" x="410" y="122" text-anchor="middle" fill="#16212b">and</text>
  <rect class="box" x="446" y="96" width="93" height="40" rx="7"/>
  <text class="t" x="492" y="122" text-anchor="middle" fill="#16212b">utterly</text>
  <rect class="box-r" x="548" y="96" width="180" height="40" rx="7"/>
  <text class="t" x="638" y="122" text-anchor="middle" fill="#c0392b">discombobulating</text>
  <rect class="box-r" x="578" y="168" width="290" height="38" rx="7"/>
  <text class="t" x="723" y="194" text-anchor="middle" fill="#c0392b">[UNK] &#183; seen 0 times</text>
  <path class="flow" d="M 638 136 L 708 166"
        stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text class="t-sub" x="40" y="192">7 tokens, one of them empty of information.</text>
  <text class="t-sub" x="40" y="214">Every rare word in the corpus meets the same fate.</text>

  <text class="t-sub" x="40" y="248">WordPiece &#183; 30,522 pieces, learned once on a corpus we never saw</text>
  <rect class="box" x="40" y="268" width="49" height="40" rx="7"/>
  <text class="t" x="64" y="294" text-anchor="middle" fill="#16212b">the</text>
  <rect class="box" x="96" y="268" width="58" height="40" rx="7"/>
  <text class="t" x="125" y="294" text-anchor="middle" fill="#16212b">plot</text>
  <rect class="box" x="161" y="268" width="49" height="40" rx="7"/>
  <text class="t" x="186" y="294" text-anchor="middle" fill="#16212b">was</text>
  <rect class="box" x="217" y="268" width="39" height="40" rx="7"/>
  <text class="t" x="236" y="294" text-anchor="middle" fill="#16212b">un</text>
  <rect class="box-m" x="263" y="268" width="87" height="40" rx="7"/>
  <text class="t" x="306" y="294" text-anchor="middle" fill="#6c3483">##watch</text>
  <rect class="box-m" x="357" y="268" width="78" height="40" rx="7"/>
  <text class="t" x="396" y="294" text-anchor="middle" fill="#6c3483">##able</text>
  <rect class="box" x="442" y="268" width="49" height="40" rx="7"/>
  <text class="t" x="466" y="294" text-anchor="middle" fill="#16212b">and</text>
  <rect class="box" x="498" y="268" width="87" height="40" rx="7"/>
  <text class="t" x="542" y="294" text-anchor="middle" fill="#16212b">utterly</text>
  <rect class="box" x="592" y="268" width="68" height="40" rx="7"/>
  <text class="t" x="626" y="294" text-anchor="middle" fill="#16212b">disco</text>
  <rect class="box-m" x="667" y="268" width="68" height="40" rx="7"/>
  <text class="t" x="701" y="294" text-anchor="middle" fill="#6c3483">##mbo</text>
  <rect class="box-m" x="742" y="268" width="78" height="40" rx="7"/>
  <text class="t" x="781" y="294" text-anchor="middle" fill="#6c3483">##bula</text>
  <rect class="box-m" x="827" y="268" width="78" height="40" rx="7"/>
  <text class="t" x="866" y="294" text-anchor="middle" fill="#6c3483">##ting</text>
  <rect class="box" x="912" y="268" width="30" height="40" rx="7"/>
  <text class="t" x="927" y="294" text-anchor="middle" fill="#16212b">.</text>
  <text class="t-sub" x="40" y="342">13 pieces, none unknown. The three pieces of <tspan fill="#0b3d62">unwatchable</tspan> keep the negation the word tokenizer threw away,</text>
  <text class="t-sub" x="40" y="364">and an unseen word falls back to pieces, a piece to characters. The vocabulary cannot miss.</text>
</svg>
