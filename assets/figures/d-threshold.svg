<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
    .glyph { font-size:23px; font-weight:700; fill:#16212b; text-anchor:middle; }
    .five  { font-size:23px; font-weight:700; fill:#14663a; text-anchor:middle; }
  </style>

  <text x="16" y="30" class="t-hd" fill="#0b3d62">Twelve instances, ordered by score, and three thresholds</text>
  <text x="16" y="54" class="t-sub">Everything to the right of a threshold is predicted “a 5”. Green squares really are 5s.</text>

  <!-- score axis -->
  <line x1="24" y1="196" x2="1056" y2="196" stroke="#b0bcc7" stroke-width="2"/>
  <text x="24" y="222" class="t-sub">lower score</text>
  <text x="1056" y="222" class="t-sub" text-anchor="end">higher score</text>

  <!-- the twelve instances: 5s at 5,7,8,10,11,12 -->
  <g>
    <rect x="30"  y="112" width="58" height="58" rx="7" class="box"/><text x="59"  y="150" class="glyph">3</text>
    <rect x="116" y="112" width="58" height="58" rx="7" class="box"/><text x="145" y="150" class="glyph">8</text>
    <rect x="202" y="112" width="58" height="58" rx="7" class="box"/><text x="231" y="150" class="glyph">1</text>
    <rect x="288" y="112" width="58" height="58" rx="7" class="box"/><text x="317" y="150" class="glyph">2</text>
    <rect x="374" y="112" width="58" height="58" rx="7" class="box-g"/><text x="403" y="150" class="five">5</text>
    <rect x="460" y="112" width="58" height="58" rx="7" class="box"/><text x="489" y="150" class="glyph">6</text>
    <rect x="546" y="112" width="58" height="58" rx="7" class="box-g"/><text x="575" y="150" class="five">5</text>
    <rect x="632" y="112" width="58" height="58" rx="7" class="box-g"/><text x="661" y="150" class="five">5</text>
    <rect x="718" y="112" width="58" height="58" rx="7" class="box"/><text x="747" y="150" class="glyph">3</text>
    <rect x="804" y="112" width="58" height="58" rx="7" class="box-g"/><text x="833" y="150" class="five">5</text>
    <rect x="890" y="112" width="58" height="58" rx="7" class="box-g"/><text x="919" y="150" class="five">5</text>
    <rect x="976" y="112" width="58" height="58" rx="7" class="box-g"/><text x="1005" y="150" class="five">5</text>
  </g>

  <!-- threshold A : between 4 and 5 -->
  <line x1="360" y1="88" x2="360" y2="188" stroke="#0b3d62" stroke-width="3"/>
  <text x="360" y="80" class="t" text-anchor="middle" font-weight="700" fill="#0b3d62">A</text>

  <!-- threshold B : between 7 and 8 -->
  <line x1="618" y1="88" x2="618" y2="188" stroke="#6c3483" stroke-width="3"/>
  <text x="618" y="80" class="t" text-anchor="middle" font-weight="700" fill="#6c3483">B</text>

  <!-- one step right of B -->
  <line x1="704" y1="88" x2="704" y2="188" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="704" y="80" class="t" text-anchor="middle" font-weight="700" fill="#c0392b">B′</text>

  <!-- threshold C -->
  <line x1="790" y1="88" x2="790" y2="188" stroke="#14663a" stroke-width="3"/>
  <text x="790" y="80" class="t" text-anchor="middle" font-weight="700" fill="#14663a">C</text>

  <!-- the table -->
  <rect x="16" y="244" width="1048" height="180" rx="7" class="box"/>

  <text x="36"  y="276" class="t-sub" font-weight="700">threshold</text>
  <text x="380" y="276" class="t-sub" font-weight="700" text-anchor="end">flagged</text>
  <text x="660" y="276" class="t-sub" font-weight="700" text-anchor="end">precision</text>
  <text x="960" y="276" class="t-sub" font-weight="700" text-anchor="end">recall</text>

  <text x="36"  y="308" class="t-sub" fill="#0b3d62" font-weight="700">A · low</text>
  <text x="380" y="308" class="t-sub" text-anchor="end">8</text>
  <text x="660" y="308" class="t-sub" text-anchor="end">6/8 = 75%</text>
  <text x="960" y="308" class="t-sub" text-anchor="end">6/6 = 100%</text>

  <text x="36"  y="340" class="t-sub" fill="#6c3483" font-weight="700">B · central</text>
  <text x="380" y="340" class="t-sub" text-anchor="end">5</text>
  <text x="660" y="340" class="t-sub" text-anchor="end">4/5 = 80%</text>
  <text x="960" y="340" class="t-sub" text-anchor="end">4/6 = 67%</text>

  <text x="36"  y="372" class="t-sub" fill="#c0392b" font-weight="700">B′ · one step right of B</text>
  <text x="380" y="372" class="t-sub" text-anchor="end" fill="#c0392b" font-weight="700">4</text>
  <text x="660" y="372" class="t-sub" text-anchor="end" fill="#c0392b" font-weight="700">3/4 = 75%</text>
  <text x="960" y="372" class="t-sub" text-anchor="end" fill="#c0392b" font-weight="700">3/6 = 50%</text>

  <text x="36"  y="404" class="t-sub" fill="#14663a" font-weight="700">C · high</text>
  <text x="380" y="404" class="t-sub" text-anchor="end">3</text>
  <text x="660" y="404" class="t-sub" text-anchor="end">3/3 = 100%</text>
  <text x="960" y="404" class="t-sub" text-anchor="end">3/6 = 50%</text>

</svg>
