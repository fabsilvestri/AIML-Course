<svg width="1080" height="380" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="30" fill="#16212b">The baseline you have to beat, and the metric it destroys</text>

  <!-- the image with the whole-image box -->
  <rect x="20" y="62" width="300" height="216" rx="7" fill="#eef4f8"
        stroke="#c0392b" stroke-width="4"/>
  <rect x="56" y="100" width="70" height="120" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <rect x="150" y="140" width="60" height="60" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <rect x="238" y="180" width="60" height="70" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <text class="t-sub" x="20" y="54" fill="#c0392b">one prediction: the whole image</text>
  <text class="t-sub" x="20" y="304" fill="#14663a">green: the true objects</text>

  <line class="flow" x1="336" y1="170" x2="392" y2="170" stroke="#c0392b"
        marker-end="url(#aw)"/>

  <rect class="box-r" x="404" y="62" width="320" height="216" rx="7"/>
  <text class="t" x="424" y="96" fill="#c0392b">“does it overlap the object?”</text>
  <text class="t-sub" x="424" y="128">every true object intersects it</text>
  <text class="t-sub" x="424" y="154">so the score is 100%,</text>
  <text class="t-sub" x="424" y="180">on every image, always,</text>
  <text class="t-sub" x="424" y="206">for a system that has learned</text>
  <text class="t-sub" x="424" y="232">nothing at all</text>
  <text class="t-sub" x="424" y="262" fill="#c0392b">a metric this baseline can win is broken</text>

  <rect class="box-g" x="740" y="62" width="326" height="216" rx="7"/>
  <text class="t" x="760" y="96" fill="#14663a">What the metric must do</text>
  <text class="t-sub" x="760" y="128">punish a box for being too large,</text>
  <text class="t-sub" x="760" y="154">not only for missing the object</text>
  <text class="t-sub" x="760" y="186">so the denominator has to include</text>
  <text class="t-sub" x="760" y="212">the part of the prediction that is</text>
  <text class="t-sub" x="760" y="238">not the object</text>
  <text class="t-sub" x="760" y="268" fill="#14663a">that is intersection over union</text>

  <text class="t-sub" x="20" y="346">Compute the baseline before you commit to a number. A metric you cannot lose at is not a metric, and you will not</text>
  <text class="t-sub" x="20" y="368">find that out from the number itself.</text>
</svg>
