<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="f-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text x="16" y="30" font-size="21" font-weight="700" fill="#0b3d62">The training set, partitioned five ways</text>
  <text x="16" y="54" font-size="19" fill="#4b5563">Every row is one complete fit. Every row scores on data that fit has never seen.</text>

  <!-- column header: the five parts -->
  <g font-size="16" fill="#4b5563" text-anchor="middle">
    <text x="255" y="86">part 1</text>
    <text x="413" y="86">part 2</text>
    <text x="571" y="86">part 3</text>
    <text x="729" y="86">part 4</text>
    <text x="887" y="86">part 5</text>
  </g>

  <!-- fold 1 -->
  <text x="168" y="123" text-anchor="end" font-size="19" font-weight="700" fill="#0b3d62">fold 1</text>
  <rect x="180" y="98" width="150" height="36" rx="7" fill="#c0392b"/>
  <rect x="338" y="98" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="496" y="98" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="654" y="98" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="812" y="98" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <text x="990" y="123" font-size="19" fill="#0b3d62">RMSE₁</text>

  <!-- fold 2 -->
  <text x="168" y="167" text-anchor="end" font-size="19" font-weight="700" fill="#0b3d62">fold 2</text>
  <rect x="180" y="142" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="338" y="142" width="150" height="36" rx="7" fill="#c0392b"/>
  <rect x="496" y="142" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="654" y="142" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="812" y="142" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <text x="990" y="167" font-size="19" fill="#0b3d62">RMSE₂</text>

  <!-- fold 3 -->
  <text x="168" y="211" text-anchor="end" font-size="19" font-weight="700" fill="#0b3d62">fold 3</text>
  <rect x="180" y="186" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="338" y="186" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="496" y="186" width="150" height="36" rx="7" fill="#c0392b"/>
  <rect x="654" y="186" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="812" y="186" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <text x="990" y="211" font-size="19" fill="#0b3d62">RMSE₃</text>

  <!-- fold 4 -->
  <text x="168" y="255" text-anchor="end" font-size="19" font-weight="700" fill="#0b3d62">fold 4</text>
  <rect x="180" y="230" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="338" y="230" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="496" y="230" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="654" y="230" width="150" height="36" rx="7" fill="#c0392b"/>
  <rect x="812" y="230" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <text x="990" y="255" font-size="19" fill="#0b3d62">RMSE₄</text>

  <!-- fold 5 -->
  <text x="168" y="299" text-anchor="end" font-size="19" font-weight="700" fill="#0b3d62">fold 5</text>
  <rect x="180" y="274" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="338" y="274" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="496" y="274" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="654" y="274" width="150" height="36" rx="7" fill="#cbd8e2"/>
  <rect x="812" y="274" width="150" height="36" rx="7" fill="#c0392b"/>
  <text x="990" y="299" font-size="19" fill="#0b3d62">RMSE₅</text>

  <!-- aggregation -->
  <path d="M 1012 310 L 1012 340 L 570 340" stroke="#0b3d62" stroke-width="2.5"
        fill="none" marker-end="url(#f-ar)"/>
  <rect x="300" y="352" width="530" height="62" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
  <text x="565" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">
    report the mean AND the standard deviation
  </text>
  <text x="565" y="402" text-anchor="middle" font-size="19" fill="#33414d">
    a mean alone hides how much the estimate moves
  </text>

  <!-- legend -->
  <g>
    <rect x="16" y="352" width="26" height="18" rx="7" fill="#c0392b"/>
    <text x="50" y="366" font-size="19" fill="#33414d">validated on</text>
    <rect x="16" y="380" width="26" height="18" rx="7" fill="#cbd8e2"/>
    <text x="50" y="394" font-size="19" fill="#33414d">trained on</text>
  </g>

  <text x="1044" y="426" text-anchor="end" font-size="16" fill="#4b5563" font-style="italic">
    k = 5 drawn; the lecture uses k = 10
  </text>
</svg>
