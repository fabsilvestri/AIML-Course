<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#0b3d62"/>
    </marker>
  </defs>

  <!-- the shared training set -->
  <rect class="box" x="400" y="20" width="280" height="52" rx="7" style="fill:#eef4f8"/>
  <text class="t" x="540" y="52" text-anchor="middle">one training set</text>

  <path class="flow" d="M 470 76 L 175 118" stroke="#0b3d62" marker-end="url(#a1)"/>
  <path class="flow" d="M 540 76 L 540 118" stroke="#0b3d62" marker-end="url(#a1)"/>
  <path class="flow" d="M 610 76 L 905 118" stroke="#0b3d62" marker-end="url(#a1)"/>

  <!-- column 1 — bagging -->
  <rect class="box-r" x="40" y="124" width="270" height="196" rx="7"/>
  <text class="t-hd" x="175" y="156" text-anchor="middle" fill="#c0392b">Bagging</text>
  <text class="t" x="62" y="192">rows: a bootstrap sample</text>
  <text class="t-sub" x="62" y="216">drawn with replacement</text>
  <text class="t" x="62" y="250">columns: all 54, at every node</text>
  <text class="t" x="62" y="284">threshold: the best one</text>
  <text class="t-sub" x="62" y="308">found by searching</text>

  <!-- column 2 — random forest -->
  <rect class="box" x="330" y="124" width="270" height="196" rx="7"/>
  <text class="t-hd" x="465" y="156" text-anchor="middle" fill="#0b3d62">Random forest</text>
  <text class="t" x="352" y="192">rows: a bootstrap sample</text>
  <text class="t-sub" x="352" y="216">drawn with replacement</text>
  <text class="t" x="352" y="250">columns: √54 ≈ 7, redrawn</text>
  <text class="t-sub" x="352" y="274">at every single node</text>
  <text class="t" x="352" y="308">threshold: the best one</text>

  <!-- column 3 — extra-trees -->
  <rect class="box-g" x="620" y="124" width="270" height="196" rx="7"/>
  <text class="t-hd" x="755" y="156" text-anchor="middle" fill="#14663a">Extra-trees</text>
  <text class="t" x="642" y="192">rows: all of them</text>
  <text class="t-sub" x="642" y="216">bootstrap=False by default</text>
  <text class="t" x="642" y="250">columns: √54 ≈ 7, redrawn</text>
  <text class="t-sub" x="642" y="274">at every single node</text>
  <text class="t" x="642" y="308">threshold: drawn at random</text>

  <!-- the shared point -->
  <path class="flow" d="M 175 328 L 175 356 L 755 356 L 755 328" stroke="#6c3483"/>
  <path class="flow" d="M 465 328 L 465 356" stroke="#6c3483"/>
  <path class="flow" d="M 465 356 L 465 380" stroke="#6c3483"/>
  <text class="t" x="465" y="402" text-anchor="middle" fill="#6c3483">each one makes
    two members less alike — each one attacks ρ</text>

  <!-- what is left alone -->
  <text class="t-sub" x="920" y="192">None of them</text>
  <text class="t-sub" x="920" y="212">changes the fact</text>
  <text class="t-sub" x="920" y="232">that all the trees</text>
  <text class="t-sub" x="920" y="252">saw the same</text>
  <text class="t-sub" x="920" y="272">forest. That is</text>
  <text class="t-sub" x="920" y="292">what ρ is.</text>
</svg>
