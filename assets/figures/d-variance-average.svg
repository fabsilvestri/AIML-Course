<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#0b3d62"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#6c3483"/>
    </marker>
  </defs>

  <!-- one predictor -->
  <text class="t-hd" x="200" y="62" text-anchor="middle" fill="#0b3d62">One tree</text>
  <text class="t-sub" x="200" y="84" text-anchor="middle">variance σ²</text>

  <rect class="box" x="140" y="100" width="120" height="168" rx="7"
        style="fill:#eef4f8"/>
  <rect class="box-m" x="140" y="268" width="120" height="72" rx="7"
        style="fill:#f2ecf6"/>
  <text class="t" x="200" y="192" text-anchor="middle">(1−ρ)σ²</text>
  <text class="t" x="200" y="311" text-anchor="middle" fill="#6c3483">ρσ²</text>

  <!-- the averaging step -->
  <path class="flow" d="M 292 220 L 486 220" stroke="#0b3d62"
        marker-end="url(#arrow)"/>
  <text class="t" x="389" y="206" text-anchor="middle">average n of them</text>
  <text class="t-sub" x="389" y="244" text-anchor="middle">all grown on the same data</text>

  <!-- the average -->
  <text class="t-hd" x="580" y="62" text-anchor="middle" fill="#0b3d62">Their average</text>
  <text class="t-sub" x="580" y="84" text-anchor="middle">variance ρσ² + (1−ρ)σ²/n</text>

  <rect class="box" x="520" y="234" width="120" height="34" rx="7"
        style="fill:#eef4f8"/>
  <rect class="box-m" x="520" y="268" width="120" height="72" rx="7"
        style="fill:#f2ecf6"/>

  <!-- callouts -->
  <path class="flow" d="M 646 248 L 706 176" stroke="#0b3d62"/>
  <text class="t" x="716" y="170">(1−ρ)σ²/n</text>
  <text class="t-sub" x="716" y="194">divided by n. Take n large enough and</text>
  <text class="t-sub" x="716" y="214">this term is gone.</text>

  <path class="flow" d="M 646 306 L 706 330" stroke="#6c3483"/>
  <text class="t" x="716" y="326" fill="#6c3483">ρσ²</text>
  <text class="t-sub" x="716" y="350">unchanged. Every member inherits it from</text>
  <text class="t-sub" x="716" y="370">the one training set they share.</text>

  <!-- the floor -->
  <path class="flow" d="M 120 268 L 660 268" stroke="#6c3483"
        stroke-dasharray="7 5"/>
  <text class="t-sub" x="112" y="264" text-anchor="end" fill="#6c3483">the floor</text>
</svg>
