<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <text class="t-hd" x="14" y="30" fill="#16212b">Four questions, four output shapes</text>

  <!-- 1 classification -->
  <rect class="box" x="14" y="56" width="248" height="250" rx="7"/>
  <text class="t" x="32" y="88" fill="#0b3d62">Classification</text>
  <rect x="46" y="106" width="184" height="120" rx="7" fill="#eef4f8"
        stroke="#b0bcc7" stroke-width="2"/>
  <text class="t-sub" x="66" y="172">one label for the picture</text>
  <text class="t-sub" x="32" y="256">output: K numbers</text>
  <text class="t-sub" x="32" y="280">Lectures 15–16</text>

  <!-- 2 detection -->
  <rect class="box-m" x="278" y="56" width="248" height="250" rx="7"/>
  <text class="t" x="296" y="88" fill="#6c3483">Detection</text>
  <rect x="310" y="106" width="184" height="120" rx="7" fill="#eef4f8"
        stroke="#b0bcc7" stroke-width="2"/>
  <rect x="326" y="122" width="76" height="88" rx="7" fill="none"
        stroke="#6c3483" stroke-width="3"/>
  <rect x="414" y="150" width="64" height="60" rx="7" fill="none"
        stroke="#6c3483" stroke-width="3"/>
  <text class="t-sub" x="296" y="256">output: N boxes, N labels</text>
  <text class="t-sub" x="296" y="280">Lectures 17–18</text>

  <!-- 3 semantic -->
  <rect class="box-g" x="542" y="56" width="248" height="250" rx="7"/>
  <text class="t" x="560" y="88" fill="#14663a">Semantic segmentation</text>
  <rect x="574" y="106" width="184" height="120" rx="7" fill="#eef4f8"
        stroke="#b0bcc7" stroke-width="2"/>
  <path d="M 590 122 h 76 v 88 h -76 Z M 666 150 h 64 v 60 h -64 Z"
        fill="#14663a" opacity="0.42"/>
  <text class="t-sub" x="560" y="256">output: one label per pixel</text>
  <text class="t-sub" x="560" y="280">two people are one region</text>

  <!-- 4 instance -->
  <rect class="box-r" x="806" y="56" width="260" height="250" rx="7"/>
  <text class="t" x="824" y="88" fill="#c0392b">Instance segmentation</text>
  <rect x="838" y="106" width="184" height="120" rx="7" fill="#eef4f8"
        stroke="#b0bcc7" stroke-width="2"/>
  <path d="M 854 122 h 76 v 88 h -76 Z" fill="#c0392b" opacity="0.42"/>
  <path d="M 930 150 h 64 v 60 h -64 Z" fill="#0b3d62" opacity="0.42"/>
  <text class="t-sub" x="824" y="256">output: one mask per object</text>
  <text class="t-sub" x="824" y="280">two people are two regions</text>

  <text class="t-sub" x="14" y="342">Pooling throws away position, which is what makes it good for the first column and harmful for the last two —</text>
  <text class="t-sub" x="14" y="366">the equivariance-versus-invariance distinction from thread 8, now with a consequence you can see.</text>
</svg>
