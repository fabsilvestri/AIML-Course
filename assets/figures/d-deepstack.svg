<svg width="1080" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
  </marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
          markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
  </marker>

  <text class="t-hd" x="0" y="24" fill="#0b3d62">Forward: the signal survives</text>
  <text class="t-sub" x="0" y="48">Each layer&#8217;s output looks like the one before it &#8212; same mean, same spread</text>

  <!-- forward row -->
  <rect class="box-g" x="0"   y="70" width="118" height="56" rx="7"/>
  <text class="t" x="59"  y="94"  text-anchor="middle">input</text>
  <text class="t-sub" x="59" y="115" text-anchor="middle">3,072 values</text>

  <rect class="box" x="152" y="70" width="104" height="56" rx="7"/>
  <text class="t" x="204" y="94"  text-anchor="middle">layer 1</text>
  <text class="t-sub" x="204" y="115" text-anchor="middle">sd 0.13</text>

  <rect class="box" x="290" y="70" width="104" height="56" rx="7"/>
  <text class="t" x="342" y="94"  text-anchor="middle">layer 2</text>
  <text class="t-sub" x="342" y="115" text-anchor="middle">sd 0.07</text>

  <text class="t" x="440" y="104" text-anchor="middle">&#8943;</text>

  <rect class="box" x="486" y="70" width="104" height="56" rx="7"/>
  <text class="t" x="538" y="94"  text-anchor="middle">layer 10</text>
  <text class="t-sub" x="538" y="115" text-anchor="middle">sd 0.07</text>

  <text class="t" x="636" y="104" text-anchor="middle">&#8943;</text>

  <rect class="box" x="682" y="70" width="104" height="56" rx="7"/>
  <text class="t" x="734" y="94"  text-anchor="middle">layer 20</text>
  <text class="t-sub" x="734" y="115" text-anchor="middle">sd 0.07</text>

  <rect class="box-g" x="838" y="70" width="118" height="56" rx="7"/>
  <text class="t" x="897" y="94"  text-anchor="middle">10 logits</text>
  <text class="t-sub" x="897" y="115" text-anchor="middle">a real loss</text>

  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 118 98 H 148"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 256 98 H 286"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 394 98 H 424"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 456 98 H 482"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 590 98 H 620"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 652 98 H 678"/>
  <path class="flow" stroke="#0b3d62" marker-end="url(#ab)" d="M 786 98 H 834"/>

  <text class="t-hd" x="0" y="212" fill="#c0392b">Backward: the gradient does not</text>
  <text class="t-sub" x="0" y="236">The same twenty layers, travelling the other way. Read this row right to left.</text>

  <!-- backward row -->
  <rect class="box-r" x="152" y="258" width="104" height="56" rx="7"/>
  <text class="t" x="204" y="282" text-anchor="middle" fill="#c0392b">layer 1</text>
  <text class="t-sub" x="204" y="303" text-anchor="middle">3&#215;10&#8315;&#185;&#8311;</text>

  <rect class="box-r" x="290" y="258" width="104" height="56" rx="7"/>
  <text class="t" x="342" y="282" text-anchor="middle" fill="#c0392b">layer 2</text>
  <text class="t-sub" x="342" y="303" text-anchor="middle">2&#215;10&#8315;&#185;&#8311;</text>

  <text class="t" x="440" y="292" text-anchor="middle">&#8943;</text>

  <rect class="box-r" x="486" y="258" width="104" height="56" rx="7"/>
  <text class="t" x="538" y="282" text-anchor="middle" fill="#c0392b">layer 10</text>
  <text class="t-sub" x="538" y="303" text-anchor="middle">2&#215;10&#8315;&#185;&#185;</text>

  <text class="t" x="636" y="292" text-anchor="middle">&#8943;</text>

  <rect class="box-r" x="682" y="258" width="104" height="56" rx="7"/>
  <text class="t" x="734" y="282" text-anchor="middle" fill="#c0392b">layer 20</text>
  <text class="t-sub" x="734" y="303" text-anchor="middle">6&#215;10&#8315;&#178;</text>

  <rect class="box-m" x="838" y="258" width="118" height="56" rx="7"/>
  <text class="t" x="897" y="282" text-anchor="middle" fill="#6c3483">loss</text>
  <text class="t-sub" x="897" y="303" text-anchor="middle">seed = 1</text>

  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 834 286 H 790"/>
  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 678 286 H 652"/>
  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 620 286 H 594"/>
  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 482 286 H 456"/>
  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 424 286 H 398"/>
  <path class="flow" stroke="#c0392b" stroke-dasharray="7 5" marker-end="url(#ar)" d="M 286 286 H 260"/>

  <text class="t-sub" x="0" y="356">Every arrow multiplies the gradient by about 0.16.</text>
  <text class="t-sub" x="0" y="378">Nineteen arrows later, layer 1 receives one part in 10&#185;&#8309;.</text>
</svg>
