<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="bv-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text class="t-hd" x="16" y="28" fill="#0b3d62">One passenger, every training set you could have drawn</text>

  <!-- the training sets -->
  <rect class="box" x="16" y="64" width="176" height="36" rx="7"/>
  <text class="t" x="104" y="89" text-anchor="middle">D&#8321;</text>
  <rect class="box" x="16" y="110" width="176" height="36" rx="7"/>
  <text class="t" x="104" y="135" text-anchor="middle">D&#8322;</text>
  <rect class="box" x="16" y="156" width="176" height="36" rx="7"/>
  <text class="t" x="104" y="181" text-anchor="middle">D&#8323;</text>
  <text class="t" x="104" y="214" text-anchor="middle" fill="#4b5563">&#8942;</text>
  <rect class="box" x="16" y="226" width="176" height="36" rx="7"/>
  <text class="t" x="104" y="251" text-anchor="middle">D<tspan font-size="14px" dy="5">B</tspan></text>
  <text class="t-sub" x="104" y="288" text-anchor="middle">712 rows &#8212; but which 712?</text>

  <path class="flow" d="M 198 82 C 236 82 236 160 264 160" stroke="#0b3d62" marker-end="url(#bv-ar)"/>
  <path class="flow" d="M 198 128 C 236 128 236 160 264 160" stroke="#0b3d62" marker-end="url(#bv-ar)"/>
  <path class="flow" d="M 198 174 C 236 174 236 160 264 160" stroke="#0b3d62" marker-end="url(#bv-ar)"/>
  <path class="flow" d="M 198 244 C 236 244 236 160 264 160" stroke="#0b3d62" marker-end="url(#bv-ar)"/>
  <text class="t-sub" x="244" y="72" text-anchor="middle" fill="#0b3d62">fit</text>

  <!-- the probability axis for one fixed passenger -->
  <line x1="300" y1="230" x2="1044" y2="230" stroke="#7b8794" stroke-width="2"/>
  <g stroke="#7b8794" stroke-width="2">
    <line x1="300" y1="224" x2="300" y2="236"/>
    <line x1="672" y1="224" x2="672" y2="236"/>
    <line x1="1044" y1="224" x2="1044" y2="236"/>
  </g>
  <g class="t-sub" fill="#4b5563" text-anchor="middle">
    <text x="300" y="254">0</text><text x="672" y="254">0.5</text><text x="1044" y="254">1</text>
  </g>
  <text class="t-sub" x="1044" y="276" text-anchor="end">estimated P(survived) for this one passenger</text>

  <!-- the individual predictions -->
  <g fill="#c0392b" opacity="0.75">
    <circle cx="742" cy="205" r="6"/><circle cx="778" cy="190" r="6"/>
    <circle cx="806" cy="209" r="6"/><circle cx="838" cy="186" r="6"/>
    <circle cx="866" cy="203" r="6"/><circle cx="700" cy="191" r="6"/>
    <circle cx="900" cy="196" r="6"/><circle cx="656" cy="207" r="6"/>
  </g>

  <!-- p-bar, the average prediction -->
  <line x1="786" y1="122" x2="786" y2="230" stroke="#0b3d62" stroke-width="2.5"/>
  <circle cx="786" cy="230" r="7" fill="#0b3d62"/>
  <text class="t" x="786" y="114" text-anchor="middle" fill="#0b3d62">p&#772;(x)</text>
  <text class="t-sub" x="786" y="94" text-anchor="middle" fill="#0b3d62">average prediction</text>

  <!-- p-star, the truth -->
  <line x1="562" y1="122" x2="562" y2="230" stroke="#6c3483" stroke-width="2.5"/>
  <circle cx="562" cy="230" r="7" fill="#6c3483"/>
  <text class="t" x="562" y="114" text-anchor="middle" fill="#6c3483">p*(x)</text>
  <text class="t-sub" x="562" y="94" text-anchor="middle" fill="#6c3483">the truth</text>

  <!-- bias bracket -->
  <path class="flow" d="M 562 146 L 786 146" stroke="#0b3d62" marker-end="url(#bv-ar)"/>
  <text class="t-sub" x="674" y="140" text-anchor="middle" fill="#0b3d62">bias</text>

  <!-- variance bracket -->
  <path d="M 650 172 L 650 164 L 906 164 L 906 172" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text class="t-sub" x="978" y="170" text-anchor="middle" fill="#c0392b">variance</text>

  <!-- noise -->
  <text class="t-sub" x="562" y="300" text-anchor="middle" fill="#6c3483">y = 0 or y = 1</text>
  <text class="t-sub" x="562" y="320" text-anchor="middle" fill="#6c3483">never p*</text>
  <line x1="562" y1="230" x2="562" y2="284" stroke="#6c3483" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- the identity -->
  <line x1="16" y1="342" x2="1064" y2="342" stroke="#b0bcc7" stroke-width="2"/>
  <text class="t" x="16" y="374">
    <tspan fill="#16212b">E&#160;[(y &#8722; p&#770;)&#178;]&#160; = &#160;</tspan><tspan fill="#0b3d62" font-weight="700">(p* &#8722; p&#772;)&#178;</tspan><tspan fill="#16212b">&#160; + &#160;</tspan><tspan fill="#c0392b" font-weight="700">E&#160;[(p&#770; &#8722; p&#772;)&#178;]</tspan><tspan fill="#16212b">&#160; + &#160;</tspan><tspan fill="#6c3483" font-weight="700">p*(1 &#8722; p*)</tspan>
  </text>
  <text class="t-sub" x="16" y="400">
    <tspan fill="#4b5563">total error &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#0b3d62">squared bias &#8212; wrong on average</tspan><tspan fill="#4b5563">&#160;&#160;&#160;&#160;</tspan><tspan fill="#c0392b">variance &#8212; unstable</tspan><tspan fill="#4b5563">&#160;&#160;&#160;&#160;</tspan><tspan fill="#6c3483">noise &#8212; nothing to be done</tspan>
  </text>
</svg>
