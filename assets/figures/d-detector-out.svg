<svg width="1080" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text class="t-hd" x="10" y="28" fill="#0b3d62">Classification</text>
  <text class="t-hd" x="560" y="28" fill="#6c3483">Detection</text>
  <line x1="530" y1="10" x2="530" y2="390" stroke="#b0bcc7" stroke-width="2"
        stroke-dasharray="6 6"/>

  <!-- left: classifier -->
  <rect class="box" x="14" y="56" width="150" height="112" rx="7"/>
  <text class="t" x="30" y="90">one image</text>
  <text class="t-sub" x="30" y="116">3 × H × W</text>
  <text class="t-sub" x="30" y="140">the input, either way</text>

  <line class="flow" x1="172" y1="112" x2="222" y2="112" stroke="#0b3d62"
        marker-end="url(#ah)"/>
  <rect class="box" x="230" y="56" width="170" height="112" rx="7"/>
  <text class="t" x="246" y="90">CNN backbone</text>
  <text class="t-sub" x="246" y="116">Lectures 15–16</text>
  <text class="t-sub" x="246" y="140">frozen, pretrained</text>

  <line class="flow" x1="408" y1="112" x2="452" y2="112" stroke="#0b3d62"
        marker-end="url(#ah)"/>
  <rect class="box-g" x="14" y="228" width="490" height="130" rx="7"/>
  <text class="t" x="34" y="262">Output: one vector of length K</text>
  <text class="t-sub" x="34" y="292">“this image is a cat, 0.93”</text>
  <text class="t-sub" x="34" y="318">Shape is fixed before you look at the image.</text>
  <text class="t-sub" x="34" y="342">One label per image; nothing says where.</text>
  <line class="flow" x1="470" y1="130" x2="300" y2="222" stroke="#14663a"
        marker-end="url(#ah)" stroke-dasharray="0"/>

  <!-- right: detector -->
  <rect class="box-m" x="560" y="56" width="230" height="112" rx="7"/>
  <text class="t" x="578" y="90">Region proposals</text>
  <text class="t-sub" x="578" y="116">a few hundred candidate</text>
  <text class="t-sub" x="578" y="140">boxes, scored and refined</text>

  <line class="flow" x1="798" y1="112" x2="842" y2="112" stroke="#6c3483"
        marker-end="url(#ah)"/>
  <rect class="box-r" x="850" y="56" width="216" height="112" rx="7"/>
  <text class="t" x="868" y="90">Suppression</text>
  <text class="t-sub" x="868" y="116">near-duplicates removed</text>
  <text class="t-sub" x="868" y="140">by overlap — Lecture 18</text>

  <rect class="box-m" x="560" y="228" width="506" height="130" rx="7"/>
  <text class="t" x="580" y="262">Output: three arrays, of a length nobody chose</text>
  <text class="t-sub" x="580" y="292">boxes (N × 4)   ·   labels (N)   ·   scores (N)</text>
  <text class="t-sub" x="580" y="318">N depends on the image, on a score cut-off, and on an overlap cut-off.</text>
  <text class="t-sub" x="580" y="342">Two numbers you did not choose are already in your answer.</text>
  <line class="flow" x1="958" y1="176" x2="820" y2="222" stroke="#6c3483"
        marker-end="url(#ah)"/>
</svg>
