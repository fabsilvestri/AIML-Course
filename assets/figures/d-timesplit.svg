<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
    .cell-tr { fill:#cbd8e2; stroke:#0b3d62; stroke-width:1.2; }
    .cell-te { fill:#c0392b; stroke:#8e2b1f; stroke-width:1.2; }
    .cell-ok { fill:#14663a; stroke:#0e4d2b; stroke-width:1.2; }
  </style>

  <defs>
    <marker id="ts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="ts-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
    <marker id="ts-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="28" fill="#0b3d62">The same rows, split two ways</text>

  <!-- legend -->
  <g>
    <rect class="cell-tr" x="700" y="14" width="24" height="17" rx="4"/>
    <text class="t-sub" x="732" y="28">fitted on</text>
    <rect class="cell-te" x="830" y="14" width="24" height="17" rx="4"/>
    <rect class="cell-ok" x="860" y="14" width="24" height="17" rx="4"/>
    <text class="t-sub" x="892" y="28">scored on</text>
  </g>
  <line x1="14" y1="44" x2="1066" y2="44" stroke="#b0bcc7" stroke-width="1.5"/>

  <!-- ================= 1 · random split ================= -->
  <text class="t" x="14" y="82" font-weight="700" fill="#c0392b">1 &#183; Random split</text>
  <text class="t-sub" x="14" y="104">KFold(shuffle=True)</text>
  <text class="t-sub" x="14" y="124">the default everywhere</text>

  <g>
    <rect class="cell-tr" x="250" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="284" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-te" x="318" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="352" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="386" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="420" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-te" x="454" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="488" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="522" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="556" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="590" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-te" x="624" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="658" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="692" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="726" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-te" x="760" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="794" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="828" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="862" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="896" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-te" x="930" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="964" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="998" y="66" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="1032" y="66" width="30" height="38" rx="7"/>
  </g>

  <!-- callout onto one held-out day and its two immediate neighbours -->
  <text class="t-sub" x="639" y="60" text-anchor="middle" fill="#c0392b">held out: day t</text>
  <path class="flow" d="M 639 110 L 639 134 L 673 134 L 673 114"
        stroke="#c0392b" marker-end="url(#ts-ar)"/>
  <path class="flow" d="M 639 110 L 639 134 L 605 134 L 605 114"
        stroke="#c0392b" marker-end="url(#ts-ar)"/>
  <text class="t" x="706" y="141" fill="#c0392b" font-weight="700">the day before and the day after</text>
  <text class="t" x="706" y="163" fill="#c0392b">are both in the training set</text>

  <!-- ================= 2 · time split ================= -->
  <text class="t" x="14" y="238" font-weight="700" fill="#14663a">2 &#183; Time-based split</text>
  <text class="t-sub" x="14" y="260">one cut, in date order</text>
  <text class="t-sub" x="14" y="280">nothing after it is ever fitted</text>

  <g>
    <rect class="cell-tr" x="250" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="284" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="318" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="352" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="386" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="420" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="454" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="488" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="522" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="556" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="590" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="624" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="658" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="692" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="726" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="760" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="794" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="828" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-tr" x="862" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-ok" x="930" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-ok" x="964" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-ok" x="998" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-ok" x="1032" y="222" width="30" height="38" rx="7"/>
    <rect class="cell-ok" x="896" y="222" width="30" height="38" rx="7"/>
  </g>
  <line x1="890" y1="206" x2="890" y2="278" stroke="#14663a" stroke-width="3"
        stroke-dasharray="7 5"/>
  <text class="t" x="890" y="198" text-anchor="middle" fill="#14663a" font-weight="700">the cut</text>
  <text class="t-sub" x="884" y="300" text-anchor="end">every day before it</text>
  <text class="t-sub" x="896" y="300">every day after it</text>

  <!-- time axis -->
  <line x1="250" y1="326" x2="1050" y2="326" stroke="#4b5563" stroke-width="2.5"
        marker-end="url(#ts-ab)"/>
  <text class="t-sub" x="1050" y="348" text-anchor="end">time</text>

  <!-- ================= what each one measures ================= -->
  <rect class="box-r" x="14" y="366" width="515" height="90" rx="7"/>
  <text class="t" x="34" y="394" fill="#c0392b" font-weight="700">Measures interpolation</text>
  <text class="t" x="34" y="418">Fill in a day whose neighbours you have</text>
  <text class="t" x="34" y="440">already been shown. Nobody needs this.</text>

  <rect class="box-g" x="551" y="366" width="515" height="90" rx="7"/>
  <text class="t" x="571" y="394" fill="#14663a" font-weight="700">Measures forecasting</text>
  <text class="t" x="571" y="418">Predict days that came after everything</text>
  <text class="t" x="571" y="440">you were fitted on. This is the job.</text>
</svg>
