<svg xmlns="http://www.w3.org/2000/svg"
     width="1080" height="430" viewBox="0 0 1080 430"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0b3d62"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14663a"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6c3483"/></marker>
  </defs>
<text class="t-hd" x="20" y="34" fill="#0b3d62">Equivariance moves the answer &#183; invariance forgets where it was</text>
<text class="t" x="20" y="66" fill="#6c3483">equivariant</text>
<rect x="60" y="80" width="120" height="90" rx="7" class="box"/>
<text class="t-sub" x="120" y="132" text-anchor="middle">x</text>
<rect x="300" y="80" width="120" height="90" rx="7" class="box"/>
<text class="t-sub" x="360" y="132" text-anchor="middle">shift(x)</text>
<line x1="180" y1="125" x2="292" y2="125" class="flow" stroke="#0b3d62" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text class="t-sub" x="236" y="114" text-anchor="middle">shift</text>
<line x1="120" y1="170" x2="120" y2="198" class="flow" stroke="#6c3483" marker-end="url(#am)"/>
<line x1="360" y1="170" x2="360" y2="198" class="flow" stroke="#6c3483" marker-end="url(#am)"/>
<rect x="560" y="80" width="440" height="90" rx="7" class="box-m"/>
<text class="t" x="780" y="132" text-anchor="middle" fill="#6c3483">conv(shift(x)) = shift(conv(x))</text>
<text class="t" x="20" y="236" fill="#14663a">invariant</text>
<rect x="60" y="250" width="120" height="90" rx="7" class="box"/>
<text class="t-sub" x="120" y="302" text-anchor="middle">x</text>
<rect x="300" y="250" width="120" height="90" rx="7" class="box"/>
<text class="t-sub" x="360" y="302" text-anchor="middle">shift(x)</text>
<line x1="180" y1="295" x2="292" y2="295" class="flow" stroke="#0b3d62" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text class="t-sub" x="236" y="284" text-anchor="middle">shift</text>
<line x1="120" y1="340" x2="120" y2="368" class="flow" stroke="#14663a" marker-end="url(#ag)"/>
<line x1="360" y1="340" x2="360" y2="368" class="flow" stroke="#14663a" marker-end="url(#ag)"/>
<rect x="560" y="250" width="440" height="90" rx="7" class="box-g"/>
<text class="t" x="780" y="302" text-anchor="middle" fill="#14663a">pool(conv(shift(x))) = pool(conv(x))</text>
<text class="t" x="20" y="404">Classification wants the second line. Per-pixel prediction cannot afford it.</text>
</svg>
