<svg width="1080" height="380" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <!-- panel 1: the two boxes -->
  <text class="t-hd" x="14" y="30" fill="#16212b">The two boxes</text>
  <rect x="30" y="60" width="180" height="150" rx="7" fill="none"
        stroke="#14663a" stroke-width="3"/>
  <rect x="120" y="120" width="180" height="150" rx="7" fill="none"
        stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
  <text class="t-sub" x="30" y="52" fill="#14663a">ground truth  A</text>
  <text class="t-sub" x="176" y="292" fill="#c0392b">prediction  B</text>

  <!-- panel 2: intersection -->
  <text class="t-hd" x="374" y="30" fill="#6c3483">Intersection</text>
  <rect x="390" y="60" width="180" height="150" rx="7" fill="none"
        stroke="#b0bcc7" stroke-width="2"/>
  <rect x="480" y="120" width="180" height="150" rx="7" fill="none"
        stroke="#b0bcc7" stroke-width="2"/>
  <rect x="480" y="120" width="90" height="90" fill="#6c3483" opacity="0.32"/>
  <text class="t" x="486" y="172" fill="#16212b">A ∩ B</text>
  <text class="t-sub" x="390" y="306">clamp each side at zero, or two</text>
  <text class="t-sub" x="390" y="328">negatives multiply to a positive</text>

  <!-- panel 3: union -->
  <text class="t-hd" x="734" y="30" fill="#0b3d62">Union</text>
  <path d="M 750 60 H 930 V 120 H 1020 V 270 H 840 V 210 H 750 Z"
        fill="#0b3d62" opacity="0.20" stroke="#0b3d62" stroke-width="2.5"/>
  <text class="t" x="770" y="172" fill="#16212b">A ∪ B</text>
  <text class="t-sub" x="750" y="306">= area(A) + area(B) − area(A ∩ B),</text>
  <text class="t-sub" x="750" y="328">so the overlap is not counted twice</text>

  <line x1="352" y1="20" x2="352" y2="340" stroke="#b0bcc7" stroke-width="2"
        stroke-dasharray="6 6"/>
  <line x1="710" y1="20" x2="710" y2="340" stroke="#b0bcc7" stroke-width="2"
        stroke-dasharray="6 6"/>
</svg>
