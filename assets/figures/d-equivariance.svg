<svg xmlns="http://www.w3.org/2000/svg"
     width="1080" height="406" viewBox="0 0 1080 406"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0b3d62"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14663a"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6c3483"/></marker>
  </defs>
<text class="t-hd" x="20" y="34" fill="#0b3d62">Equivariance moves the answer &#183; invariance forgets where it was</text>
<text class="t" x="20" y="72" fill="#6c3483">equivariant</text>
<rect x="60" y="84" width="120" height="92" rx="7" class="box"/>
<text class="t" x="120" y="136" text-anchor="middle">x</text>
<rect x="300" y="84" width="120" height="92" rx="7" class="box"/>
<text class="t" x="360" y="136" text-anchor="middle">shift(x)</text>
<line x1="182" y1="130" x2="292" y2="130" class="flow" stroke="#0b3d62" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text class="t-sub" x="237" y="116" text-anchor="middle">shift</text>
<line x1="422" y1="130" x2="552" y2="130" class="flow" stroke="#6c3483" marker-end="url(#am)"/>
<text class="t-sub" x="487" y="116" text-anchor="middle" fill="#6c3483">conv</text>
<rect x="562" y="84" width="458" height="92" rx="7" class="box-m"/>
<text class="t" x="791" y="136" text-anchor="middle" fill="#6c3483">conv(shift(x)) = shift(conv(x))</text>
<text class="t" x="20" y="220" fill="#14663a">invariant</text>
<rect x="60" y="232" width="120" height="92" rx="7" class="box"/>
<text class="t" x="120" y="284" text-anchor="middle">x</text>
<rect x="300" y="232" width="120" height="92" rx="7" class="box"/>
<text class="t" x="360" y="284" text-anchor="middle">shift(x)</text>
<line x1="182" y1="278" x2="292" y2="278" class="flow" stroke="#0b3d62" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text class="t-sub" x="237" y="264" text-anchor="middle">shift</text>
<line x1="422" y1="278" x2="552" y2="278" class="flow" stroke="#14663a" marker-end="url(#ag)"/>
<text class="t-sub" x="487" y="264" text-anchor="middle" fill="#14663a">conv, then pool</text>
<rect x="562" y="232" width="458" height="92" rx="7" class="box-g"/>
<text class="t" x="791" y="284" text-anchor="middle" fill="#14663a">pool(conv(shift(x))) = pool(conv(x))</text>
<text class="t" x="20" y="386">Classification wants the second line. Per-pixel prediction cannot afford it.</text>
</svg>
