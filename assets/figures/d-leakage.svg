<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="k-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="k-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="k-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <!-- =============== LEFT: the leak =============== -->
  <g>
    <rect x="10" y="10" width="530" height="450" rx="10" fill="#fdf1ef" stroke="#c0392b" stroke-width="2.5"/>
    <text x="275" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#c0392b">Scale, then split</text>
    <text x="275" y="68" text-anchor="middle" font-size="16" fill="#c0392b">what the under-specified prompt returns</text>

    <rect x="175" y="90" width="200" height="52" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <text x="275" y="122" text-anchor="middle" font-size="17" fill="#16212b">all 20,640 rows</text>

    <path d="M 275 144 L 275 176" stroke="#c0392b" stroke-width="2.5" marker-end="url(#k-arA)" fill="none"/>

    <rect x="150" y="178" width="250" height="58" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
    <text x="275" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#c0392b">scaler.fit_transform(X)</text>
    <text x="275" y="224" text-anchor="middle" font-size="14.5" fill="#c0392b">mean and std computed here</text>

    <path d="M 275 238 L 275 268" stroke="#c0392b" stroke-width="2.5" marker-end="url(#k-arA)" fill="none"/>

    <rect x="175" y="270" width="200" height="46" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <text x="275" y="299" text-anchor="middle" font-size="17" fill="#16212b">train_test_split</text>

    <path d="M 240 318 L 150 352" stroke="#c0392b" stroke-width="2.5" marker-end="url(#k-arA)" fill="none"/>
    <path d="M 310 318 L 400 352" stroke="#c0392b" stroke-width="2.5" marker-end="url(#k-arA)" fill="none"/>

    <rect x="45" y="356" width="200" height="52" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <text x="145" y="388" text-anchor="middle" font-size="17" fill="#16212b">train</text>

    <rect x="305" y="356" width="200" height="52" rx="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <text x="405" y="388" text-anchor="middle" font-size="17" fill="#16212b">test</text>

    <!-- the leaking information path -->
    <path d="M 505 382 C 545 382 545 207 402 207" stroke="#c0392b" stroke-width="3"
          fill="none" stroke-dasharray="9 6" marker-end="url(#k-arA)"/>
    <text x="275" y="435" text-anchor="middle" font-size="16.5" font-weight="700" fill="#c0392b">
      the test set&#8217;s statistics reached the scaler
    </text>
    <text x="275" y="454" text-anchor="middle" font-size="15" fill="#c0392b">
      the score is optimistic, and nothing crashed
    </text>
  </g>

  <!-- =============== RIGHT: the fix =============== -->
  <g>
    <rect x="580" y="10" width="530" height="450" rx="10" fill="#eff8f2" stroke="#1e8449" stroke-width="2.5"/>
    <text x="845" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#1e8449">Split, then scale</text>
    <text x="845" y="68" text-anchor="middle" font-size="16" fill="#1e8449">what the specification must demand</text>

    <rect x="745" y="90" width="200" height="52" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
    <text x="845" y="122" text-anchor="middle" font-size="17" fill="#16212b">all 20,640 rows</text>

    <path d="M 845 144 L 845 176" stroke="#1e8449" stroke-width="2.5" marker-end="url(#k-arG)" fill="none"/>

    <rect x="745" y="178" width="200" height="46" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2.5"/>
    <text x="845" y="207" text-anchor="middle" font-size="17" font-weight="700" fill="#1e8449">train_test_split</text>

    <path d="M 810 226 L 720 262" stroke="#1e8449" stroke-width="2.5" marker-end="url(#k-arG)" fill="none"/>
    <path d="M 880 226 L 970 262" stroke="#1e8449" stroke-width="2.5" marker-end="url(#k-arG)" fill="none"/>

    <rect x="615" y="266" width="210" height="52" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
    <text x="720" y="298" text-anchor="middle" font-size="17" fill="#16212b">train</text>

    <rect x="875" y="266" width="210" height="52" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
    <text x="980" y="298" text-anchor="middle" font-size="17" fill="#16212b">test</text>

    <path d="M 720 320 L 720 352" stroke="#1e8449" stroke-width="2.5" marker-end="url(#k-arG)" fill="none"/>
    <path d="M 980 320 L 980 352" stroke="#1e8449" stroke-width="2.5" marker-end="url(#k-arG)" fill="none"/>

    <rect x="605" y="354" width="230" height="54" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2.5"/>
    <text x="720" y="378" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e8449">scaler.fit_transform</text>
    <text x="720" y="398" text-anchor="middle" font-size="14.5" fill="#1e8449">fit happens only here</text>

    <rect x="865" y="354" width="230" height="54" rx="7" fill="#ffffff" stroke="#1e8449" stroke-width="2.5"/>
    <text x="980" y="378" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e8449">scaler.transform</text>
    <text x="980" y="398" text-anchor="middle" font-size="14.5" fill="#1e8449">no fitting, ever</text>

    <!-- the one-way arrow: parameters travel train -> test, never back -->
    <path d="M 838 381 L 860 381" stroke="#1e8449" stroke-width="3" marker-end="url(#k-arG)" fill="none"/>

    <text x="845" y="437" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1e8449">
      information flows one way only
    </text>
    <text x="845" y="456" text-anchor="middle" font-size="15" fill="#1e8449">
      two lines, one asymmetry, an honest number
    </text>
  </g>
</svg>
