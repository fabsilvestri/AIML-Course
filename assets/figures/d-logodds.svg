<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="lo-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <text class="t-hd" x="16" y="28" fill="#0b3d62">One number, read on three scales</text>

  <!-- the chain -->
  <rect class="box" x="16" y="48" width="242" height="62" rx="7"/>
  <text class="t" x="137" y="74" text-anchor="middle">log-odds &#160; t = &#952;&#183;x</text>
  <text class="t-sub" x="137" y="96" text-anchor="middle">any real number</text>

  <path class="flow" d="M 268 79 L 344 79" stroke="#0b3d62" marker-end="url(#lo-ar)"/>
  <text class="t-sub" x="306" y="68" text-anchor="middle" fill="#0b3d62">exp</text>

  <rect class="box-m" x="354" y="48" width="242" height="62" rx="7"/>
  <text class="t" x="475" y="74" text-anchor="middle">odds &#160; e&#7511;</text>
  <text class="t-sub" x="475" y="96" text-anchor="middle">strictly positive</text>

  <path class="flow" d="M 606 79 L 692 79" stroke="#0b3d62" marker-end="url(#lo-ar)"/>
  <text class="t-sub" x="649" y="68" text-anchor="middle" fill="#0b3d62">normalise</text>

  <rect class="box-g" x="702" y="48" width="362" height="62" rx="7"/>
  <text class="t" x="883" y="74" text-anchor="middle">probability &#160; &#963;(t) = e&#7511;/(1 + e&#7511;)</text>
  <text class="t-sub" x="883" y="96" text-anchor="middle">strictly between 0 and 1</text>

  <!-- the three aligned scales -->
  <g stroke="#6c3483" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.5">
    <line x1="248" y1="172" x2="248" y2="310"/>
    <line x1="424" y1="172" x2="424" y2="310"/>
    <line x1="600" y1="172" x2="600" y2="310"/>
    <line x1="776" y1="172" x2="776" y2="310"/>
    <line x1="952" y1="172" x2="952" y2="310"/>
  </g>

  <g stroke="#7b8794" stroke-width="2">
    <line x1="212" y1="172" x2="1000" y2="172"/>
    <line x1="212" y1="241" x2="1000" y2="241"/>
    <line x1="212" y1="310" x2="1000" y2="310"/>
    <line x1="248" y1="166" x2="248" y2="178"/><line x1="424" y1="166" x2="424" y2="178"/>
    <line x1="600" y1="166" x2="600" y2="178"/><line x1="776" y1="166" x2="776" y2="178"/>
    <line x1="952" y1="166" x2="952" y2="178"/>
    <line x1="248" y1="235" x2="248" y2="247"/><line x1="424" y1="235" x2="424" y2="247"/>
    <line x1="600" y1="235" x2="600" y2="247"/><line x1="776" y1="235" x2="776" y2="247"/>
    <line x1="952" y1="235" x2="952" y2="247"/>
    <line x1="248" y1="304" x2="248" y2="316"/><line x1="424" y1="304" x2="424" y2="316"/>
    <line x1="600" y1="304" x2="600" y2="316"/><line x1="776" y1="304" x2="776" y2="316"/>
    <line x1="952" y1="304" x2="952" y2="316"/>
  </g>

  <g class="t-sub" fill="#4b5563" text-anchor="end">
    <text x="196" y="177">log-odds &#160;t</text>
    <text x="196" y="246">odds &#160;e&#7511;</text>
    <text x="196" y="315">probability</text>
  </g>

  <g class="t" text-anchor="middle" fill="#16212b">
    <text x="248" y="160">&#8722;4</text><text x="424" y="160">&#8722;2</text>
    <text x="600" y="160">0</text><text x="776" y="160">2</text><text x="952" y="160">4</text>
    <text x="248" y="229">0.018</text><text x="424" y="229">0.135</text>
    <text x="600" y="229">1.00</text><text x="776" y="229">7.39</text><text x="952" y="229">54.6</text>
    <text x="248" y="298">0.018</text><text x="424" y="298">0.119</text>
    <text x="600" y="298">0.500</text><text x="776" y="298">0.881</text><text x="952" y="298">0.982</text>
  </g>

  <text class="t-sub" x="212" y="344" fill="#6c3483">Equal steps on the top scale become equal
    <tspan font-weight="700">multipliers</tspan> on the middle one &#8212; and neither on the bottom one.</text>
  <text class="t-sub" x="212" y="366" fill="#6c3483">That is why a coefficient is a multiplier on the
    <tspan font-weight="700">odds</tspan>, never on the probability.</text>
</svg>
