<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="cf-ar-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
    <marker id="cf-ar-m" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
  </defs>

  <text x="16" y="30" class="t-hd" fill="#0b3d62">One table, four counts, two different ratios</text>
  <text x="16" y="54" class="t-sub">Precision divides down a column. Recall divides across a row. That is the whole difference.</text>

  <text x="330" y="106" class="t" text-anchor="middle" font-weight="700">predicted “not a 5”</text>
  <text x="566" y="106" class="t" text-anchor="middle" font-weight="700">predicted “a 5”</text>

  <text x="196" y="164" class="t" text-anchor="end" font-weight="700">actually not a 5</text>
  <rect x="212" y="120" width="236" height="80" rx="7" class="box"/>
  <text x="330" y="152" class="t" text-anchor="middle" font-weight="700">true negatives</text>
  <text x="330" y="178" class="t-sub" text-anchor="middle">TN — 53,957</text>

  <rect x="448" y="120" width="236" height="80" rx="7" class="box-r"/>
  <text x="566" y="152" class="t" text-anchor="middle" font-weight="700" fill="#c0392b">false positives</text>
  <text x="566" y="178" class="t-sub" text-anchor="middle">FP — 622 · a false alarm</text>

  <text x="196" y="248" class="t" text-anchor="end" font-weight="700">actually a 5</text>
  <rect x="212" y="204" width="236" height="80" rx="7" class="box-r"/>
  <text x="330" y="236" class="t" text-anchor="middle" font-weight="700" fill="#c0392b">false negatives</text>
  <text x="330" y="262" class="t-sub" text-anchor="middle">FN — 1,237 · a 5 that got away</text>

  <rect x="448" y="204" width="236" height="80" rx="7" class="box-g"/>
  <text x="566" y="236" class="t" text-anchor="middle" font-weight="700" fill="#14663a">true positives</text>
  <text x="566" y="262" class="t-sub" text-anchor="middle">TP — 4,184</text>

  <!-- precision : down the right-hand column -->
  <path d="M 696 160 L 728 160 L 728 244 L 696 244" stroke="#6c3483" class="flow"/>
  <path d="M 728 202 L 772 202" stroke="#6c3483" class="flow" marker-end="url(#cf-ar-m)"/>
  <rect x="776" y="152" width="288" height="100" rx="7" class="box-m"/>
  <text x="920" y="182" class="t" text-anchor="middle" font-weight="700" fill="#6c3483">precision</text>
  <text x="920" y="208" class="t-sub" text-anchor="middle">TP / (TP + FP) = 4,184 / 4,806</text>
  <text x="920" y="234" class="t-sub" text-anchor="middle">= 87.06% · a denominator we choose</text>

  <!-- recall : across the bottom row -->
  <path d="M 330 296 L 330 316 L 566 316 L 566 296" stroke="#14663a" class="flow"/>
  <path d="M 448 316 L 448 340" stroke="#14663a" class="flow" marker-end="url(#cf-ar-g)"/>
  <rect x="212" y="336" width="472" height="60" rx="7" class="box-g"/>
  <text x="448" y="362" class="t" text-anchor="middle" font-weight="700" fill="#14663a">recall</text>
  <text x="448" y="386" class="t-sub" text-anchor="middle">TP / (TP + FN) = 4,184 / 5,421 = 77.18%</text>
</svg>
