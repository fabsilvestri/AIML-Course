<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="ml-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <text class="t-hd" x="20" y="34" fill="#0b3d62">The multilayer perceptron this application builds</text>

  <!-- every unit of one layer feeds every unit of the next: that is what "dense" means -->
  <g stroke="#b0bcc7" stroke-width="1" fill="none">
    <path d="M 172 120 L 398 100"/>
    <path d="M 172 120 L 398 170"/>
    <path d="M 172 120 L 398 240"/>
    <path d="M 172 120 L 398 310"/>
    <path d="M 172 120 L 398 380"/>
    <path d="M 172 190 L 398 100"/>
    <path d="M 172 190 L 398 170"/>
    <path d="M 172 190 L 398 240"/>
    <path d="M 172 190 L 398 310"/>
    <path d="M 172 190 L 398 380"/>
    <path d="M 172 260 L 398 100"/>
    <path d="M 172 260 L 398 170"/>
    <path d="M 172 260 L 398 240"/>
    <path d="M 172 260 L 398 310"/>
    <path d="M 172 260 L 398 380"/>
    <path d="M 172 330 L 398 100"/>
    <path d="M 172 330 L 398 170"/>
    <path d="M 172 330 L 398 240"/>
    <path d="M 172 330 L 398 310"/>
    <path d="M 172 330 L 398 380"/>
    <path d="M 442 100 L 668 120"/>
    <path d="M 442 100 L 668 190"/>
    <path d="M 442 100 L 668 260"/>
    <path d="M 442 100 L 668 330"/>
    <path d="M 442 170 L 668 120"/>
    <path d="M 442 170 L 668 190"/>
    <path d="M 442 170 L 668 260"/>
    <path d="M 442 170 L 668 330"/>
    <path d="M 442 240 L 668 120"/>
    <path d="M 442 240 L 668 190"/>
    <path d="M 442 240 L 668 260"/>
    <path d="M 442 240 L 668 330"/>
    <path d="M 442 310 L 668 120"/>
    <path d="M 442 310 L 668 190"/>
    <path d="M 442 310 L 668 260"/>
    <path d="M 442 310 L 668 330"/>
    <path d="M 442 380 L 668 120"/>
    <path d="M 442 380 L 668 190"/>
    <path d="M 442 380 L 668 260"/>
    <path d="M 442 380 L 668 330"/>
    <path d="M 712 120 L 918 155"/>
    <path d="M 712 120 L 918 225"/>
    <path d="M 712 120 L 918 295"/>
    <path d="M 712 190 L 918 155"/>
    <path d="M 712 190 L 918 225"/>
    <path d="M 712 190 L 918 295"/>
    <path d="M 712 260 L 918 155"/>
    <path d="M 712 260 L 918 225"/>
    <path d="M 712 260 L 918 295"/>
    <path d="M 712 330 L 918 155"/>
    <path d="M 712 330 L 918 225"/>
    <path d="M 712 330 L 918 295"/>
  </g>

  <!-- input layer -->
  <g class="box">
    <circle cx="150" cy="120" r="22"/><circle cx="150" cy="190" r="22"/>
    <circle cx="150" cy="260" r="22"/><circle cx="150" cy="330" r="22"/>
  </g>
  <text class="t-sub" x="150" y="368" text-anchor="middle">&#8942;</text>
  <text class="t" x="150" y="80" text-anchor="middle" fill="#0b3d62">input</text>
  <text class="t-sub" x="150" y="410" text-anchor="middle">784 pixels</text>
  <text class="t-sub" x="150" y="432" text-anchor="middle">no weights here</text>

  <!-- hidden 1 -->
  <g class="box-m">
    <circle cx="420" cy="100" r="22"/><circle cx="420" cy="170" r="22"/>
    <circle cx="420" cy="240" r="22"/><circle cx="420" cy="310" r="22"/>
    <circle cx="420" cy="380" r="22"/>
  </g>
  <text class="t" x="420" y="66" text-anchor="middle" fill="#6c3483">hidden 1</text>
  <text class="t-sub" x="420" y="418" text-anchor="middle">300 units &#183; ReLU</text>
  <text class="t-sub" x="420" y="440" text-anchor="middle">235,500 parameters</text>

  <!-- hidden 2 -->
  <g class="box-m">
    <circle cx="690" cy="120" r="22"/><circle cx="690" cy="190" r="22"/>
    <circle cx="690" cy="260" r="22"/><circle cx="690" cy="330" r="22"/>
  </g>
  <text class="t" x="690" y="80" text-anchor="middle" fill="#6c3483">hidden 2</text>
  <text class="t-sub" x="690" y="418" text-anchor="middle">100 units &#183; ReLU</text>
  <text class="t-sub" x="690" y="440" text-anchor="middle">30,100 parameters</text>

  <!-- output -->
  <g class="box-g">
    <circle cx="940" cy="155" r="22"/><circle cx="940" cy="225" r="22"/>
    <circle cx="940" cy="295" r="22"/>
  </g>
  <text class="t-sub" x="940" y="336" text-anchor="middle">&#8942;</text>
  <text class="t" x="940" y="112" text-anchor="middle" fill="#14663a">output</text>
  <text class="t-sub" x="940" y="418" text-anchor="middle">10 units &#183; softmax</text>
  <text class="t-sub" x="940" y="440" text-anchor="middle">1,010 parameters</text>

  <path class="flow" stroke="#0b3d62" marker-end="url(#ml-ar)" d="M 40 462 L 1040 462"/>
  <text class="t-sub" x="480" y="454" fill="#4b5563">forward pass</text>
</svg>
