<svg xmlns="http://www.w3.org/2000/svg"
     width="1080" height="400" viewBox="0 0 1080 400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0b3d62"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14663a"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6c3483"/></marker>
  </defs>
<text class="t-hd" x="20" y="34" fill="#0b3d62">What is alive between the forward and the backward pass</text>
<rect x="40" y="80" width="300" height="110" rx="7" class="box"/>
<text class="t" x="190" y="120" text-anchor="middle">parameters</text>
<text class="t-sub" x="190" y="148" text-anchor="middle">weights + gradients + Adam</text>
<text class="t-sub" x="190" y="172" text-anchor="middle">fixed &#8212; independent of the batch</text>
<rect x="40" y="220" width="640" height="150" rx="7" class="box-r"/>
<text class="t" x="360" y="262" text-anchor="middle" fill="#c0392b">every layer&#8217;s output</text>
<text class="t-sub" x="360" y="292" text-anchor="middle">kept because the backward pass evaluates each Jacobian at the value</text>
<text class="t-sub" x="360" y="316" text-anchor="middle">the forward pass reached &#8212; thread 6, in bytes</text>
<text class="t" x="360" y="350" text-anchor="middle" fill="#c0392b">&#215; batch size</text>
<line x1="700" y1="295" x2="756" y2="295" class="flow" stroke="#c0392b" marker-end="url(#ar)"/>
<rect x="770" y="220" width="280" height="150" rx="7" class="box-r"/>
<text class="t" x="910" y="280" text-anchor="middle" fill="#c0392b">out of memory</text>
<text class="t-sub" x="910" y="312" text-anchor="middle">halve the batch, not the model</text>
</svg>
