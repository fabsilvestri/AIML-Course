<svg width="1080" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
    .cell  { stroke:#b0bcc7; stroke-width:2; }
  </style>

  <defs>
    <marker id="cm-ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3483"/>
    </marker>
  </defs>

  <text class="t-hd" x="24" y="30" fill="#6c3483">One batch of five pairs</text>
  <text class="t-sub" x="24" y="52">every cell is a cosine; the diagonal is the only thing that should win its row</text>

  <!-- column headers: texts -->
  <text class="t-sub" x="176" y="96" text-anchor="middle">T&#8321;</text>
  <text class="t-sub" x="240" y="96" text-anchor="middle">T&#8322;</text>
  <text class="t-sub" x="304" y="96" text-anchor="middle">T&#8323;</text>
  <text class="t-sub" x="368" y="96" text-anchor="middle">T&#8324;</text>
  <text class="t-sub" x="432" y="96" text-anchor="middle">T&#8325;</text>
  <text class="t-sub" x="304" y="74" text-anchor="middle">captions in the batch</text>

  <!-- the 5x5 grid -->
  <g class="cell">
    <rect x="144" y="106" width="64" height="52" rx="7" fill="#d8ece0" stroke="#14663a"/>
    <rect x="208" y="106" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="272" y="106" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="336" y="106" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="400" y="106" width="64" height="52" rx="7" fill="#eef1f4"/>

    <rect x="144" y="158" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="208" y="158" width="64" height="52" rx="7" fill="#d8ece0" stroke="#14663a"/>
    <rect x="272" y="158" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="336" y="158" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="400" y="158" width="64" height="52" rx="7" fill="#eef1f4"/>

    <rect x="144" y="210" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="208" y="210" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="272" y="210" width="64" height="52" rx="7" fill="#d8ece0" stroke="#14663a"/>
    <rect x="336" y="210" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="400" y="210" width="64" height="52" rx="7" fill="#eef1f4"/>

    <rect x="144" y="262" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="208" y="262" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="272" y="262" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="336" y="262" width="64" height="52" rx="7" fill="#d8ece0" stroke="#14663a"/>
    <rect x="400" y="262" width="64" height="52" rx="7" fill="#eef1f4"/>

    <rect x="144" y="314" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="208" y="314" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="272" y="314" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="336" y="314" width="64" height="52" rx="7" fill="#eef1f4"/>
    <rect x="400" y="314" width="64" height="52" rx="7" fill="#d8ece0" stroke="#14663a"/>
  </g>

  <!-- row labels: images -->
  <text class="t-sub" x="130" y="139" text-anchor="end">I&#8321;</text>
  <text class="t-sub" x="130" y="191" text-anchor="end">I&#8322;</text>
  <text class="t-sub" x="130" y="243" text-anchor="end">I&#8323;</text>
  <text class="t-sub" x="130" y="295" text-anchor="end">I&#8324;</text>
  <text class="t-sub" x="130" y="347" text-anchor="end">I&#8325;</text>
  <text class="t-sub" x="70" y="243" text-anchor="middle">images</text>

  <!-- one row picked out -->
  <path class="flow" d="M 472 184 L 520 184" stroke="#6c3483" marker-end="url(#cm-ar)"/>

  <rect class="box-m" x="528" y="106" width="528" height="118" rx="7"/>
  <text class="t" x="546" y="132" fill="#6c3483">Row 2 is a five-class classification problem</text>
  <text class="t-sub" x="546" y="156">One positive, four negatives, and a softmax across the row —</text>
  <text class="t-sub" x="546" y="178">so the batch <tspan font-style="italic">is</tspan> the label set. Thread 11 all over again: cross-entropy</text>
  <text class="t-sub" x="546" y="200">over logits, where the logits are cosines divided by a temperature.</text>

  <rect class="box-g" x="528" y="238" width="258" height="128" rx="7"/>
  <text class="t" x="546" y="264" fill="#14663a">Bigger batch</text>
  <text class="t-sub" x="546" y="288">more negatives per positive,</text>
  <text class="t-sub" x="546" y="310">so a harder task and a lower</text>
  <text class="t-sub" x="546" y="332">chance level: 1/B, not 1/5</text>
  <text class="t-sub" x="546" y="354">— the only reason to want one</text>

  <rect class="box-r" x="798" y="238" width="258" height="128" rx="7"/>
  <text class="t" x="816" y="264" fill="#c0392b">Not normalised</text>
  <text class="t-sub" x="816" y="288">the cells stop being cosines,</text>
  <text class="t-sub" x="816" y="310">the temperature stops meaning</text>
  <text class="t-sub" x="816" y="332">anything, and the longest</text>
  <text class="t-sub" x="816" y="354">vector wins every row</text>
</svg>
