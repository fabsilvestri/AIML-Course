<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
    .day   { fill:#f4f7f9; stroke:#b0bcc7; stroke-width:1.2; }
    .inp   { fill:#cbd8e2; stroke:#0b3d62; stroke-width:1.4; }
    .tgt   { fill:#14663a; stroke:#0e4d2b; stroke-width:1.4; }
  </style>
  <defs>
    <marker id="w-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
  </defs>

  <text class="t-hd" x="14" y="28" fill="#0b3d62">Turning one series into a table of rows</text>
  <text class="t-sub" x="14" y="52">Each row is a window of past days; its label is the day that follows.</text>

  <!-- day ruler -->
  <g class="t-sub" text-anchor="middle" fill="#4b5563">
    <text x="145" y="82">1</text><text x="203" y="82">2</text><text x="261" y="82">3</text>
    <text x="319" y="82">4</text><text x="377" y="82">5</text><text x="435" y="82">6</text>
    <text x="493" y="82">7</text><text x="551" y="82">8</text><text x="609" y="82">9</text>
    <text x="667" y="82">10</text><text x="725" y="82">11</text><text x="783" y="82">12</text>
    <text x="841" y="82">13</text><text x="899" y="82">14</text><text x="957" y="82">15</text>
    <text x="1015" y="82">16</text>
  </g>
  <text class="t-sub" x="14" y="82">day</text>

  <!-- row 1 -->
  <text class="t" x="14" y="118" font-weight="700" fill="#0b3d62">row 1</text>
  <g>
    <rect class="inp" x="120" y="94" width="50" height="34" rx="7"/>
    <rect class="inp" x="178" y="94" width="50" height="34" rx="7"/>
    <rect class="inp" x="236" y="94" width="50" height="34" rx="7"/>
    <rect class="inp" x="294" y="94" width="50" height="34" rx="7"/>
    <rect class="inp" x="352" y="94" width="50" height="34" rx="7"/>
    <rect class="inp" x="410" y="94" width="50" height="34" rx="7"/>
    <rect class="tgt" x="468" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="526" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="584" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="642" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="700" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="758" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="816" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="874" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="932" y="94" width="50" height="34" rx="7"/>
    <rect class="day" x="990" y="94" width="50" height="34" rx="7"/>
  </g>

  <!-- row 2 -->
  <text class="t" x="14" y="166" font-weight="700" fill="#0b3d62">row 2</text>
  <g>
    <rect class="day" x="120" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="178" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="236" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="294" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="352" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="410" y="142" width="50" height="34" rx="7"/>
    <rect class="inp" x="468" y="142" width="50" height="34" rx="7"/>
    <rect class="tgt" x="526" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="584" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="642" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="700" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="758" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="816" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="874" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="932" y="142" width="50" height="34" rx="7"/>
    <rect class="day" x="990" y="142" width="50" height="34" rx="7"/>
  </g>

  <!-- row 3 -->
  <text class="t" x="14" y="214" font-weight="700" fill="#0b3d62">row 3</text>
  <g>
    <rect class="day" x="120" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="178" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="236" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="294" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="352" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="410" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="468" y="190" width="50" height="34" rx="7"/>
    <rect class="inp" x="526" y="190" width="50" height="34" rx="7"/>
    <rect class="tgt" x="584" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="642" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="700" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="758" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="816" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="874" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="932" y="190" width="50" height="34" rx="7"/>
    <rect class="day" x="990" y="190" width="50" height="34" rx="7"/>
  </g>

  <!-- overlap bracket: rows 1 and 2 share days 2-6 -->
  <path class="flow" d="M 180 234 L 180 250 L 458 250 L 458 234" stroke="#c0392b"/>
  <text class="t" x="474" y="256" fill="#c0392b" font-weight="700">
    rows 1 and 2 share five of their six inputs
  </text>

  <!-- legend -->
  <g>
    <rect class="inp" x="14" y="300" width="26" height="20" rx="6"/>
    <text class="t" x="50" y="317">input</text>
    <rect class="tgt" x="140" y="300" width="26" height="20" rx="6"/>
    <text class="t" x="176" y="317">label</text>
    <rect class="day" x="256" y="300" width="26" height="20" rx="6"/>
    <text class="t" x="292" y="317">not in this row</text>
  </g>

  <text class="t-sub" x="14" y="352" font-style="italic">
    drawn with a 6-day window; the lecture uses 56, so consecutive rows share 55 of 56
  </text>

  <rect class="box-g" x="14" y="364" width="1052" height="44" rx="7"/>
  <text class="t" x="34" y="392"><tspan fill="#14663a" font-weight="700">Inside a row, nothing looks forward.</tspan>
    Whether that still holds across rows is decided by the split, not by this table.</text>
</svg>
