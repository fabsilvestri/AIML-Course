<svg xmlns="http://www.w3.org/2000/svg"
     width="1080" height="350" viewBox="0 0 1080 350"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0b3d62"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14663a"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3"
            orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6c3483"/></marker>
  </defs>
<text class="t-hd" x="20" y="34" fill="#0b3d62">Freeze the general, train the specific</text>
<rect x="40" y="110" width="180" height="96" rx="7" class="box"/>
<text class="t" x="130.0" y="152" text-anchor="middle" fill="#4b5563">conv1 + layer1</text>
<text class="t-sub" x="130.0" y="180" text-anchor="middle" fill="#4b5563">frozen</text>
<rect x="242" y="110" width="180" height="96" rx="7" class="box"/>
<text class="t" x="332.0" y="152" text-anchor="middle" fill="#4b5563">layer2</text>
<text class="t-sub" x="332.0" y="180" text-anchor="middle" fill="#4b5563">frozen</text>
<line x1="220" y1="158" x2="236" y2="158" class="flow" stroke="#0b3d62" marker-end="url(#a)"/>
<rect x="444" y="110" width="180" height="96" rx="7" class="box"/>
<text class="t" x="534.0" y="152" text-anchor="middle" fill="#4b5563">layer3</text>
<text class="t-sub" x="534.0" y="180" text-anchor="middle" fill="#4b5563">frozen</text>
<line x1="422" y1="158" x2="438" y2="158" class="flow" stroke="#0b3d62" marker-end="url(#a)"/>
<rect x="646" y="110" width="180" height="96" rx="7" class="box-m"/>
<text class="t" x="736.0" y="152" text-anchor="middle" fill="#6c3483">layer4</text>
<text class="t-sub" x="736.0" y="180" text-anchor="middle" fill="#6c3483">lr 1e-4</text>
<line x1="624" y1="158" x2="640" y2="158" class="flow" stroke="#0b3d62" marker-end="url(#a)"/>
<rect x="848" y="110" width="190" height="96" rx="7" class="box-g"/>
<text class="t" x="943.0" y="152" text-anchor="middle" fill="#14663a">new fc &#8594; 102</text>
<text class="t-sub" x="943.0" y="180" text-anchor="middle" fill="#14663a">lr 1e-3</text>
<line x1="826" y1="158" x2="842" y2="158" class="flow" stroke="#0b3d62" marker-end="url(#a)"/>
<text class="t-sub" x="40" y="88">ImageNet weights, 11,689,512 parameters, downloaded not trained</text>
<text class="t" x="40" y="264">2,782,784 parameters never move. 8,446,054 do.</text>
<text class="t-sub" x="40" y="298">Two learning rates, one optimiser: the early layers already hold edges and colours,</text>
<text class="t-sub" x="40" y="322">and 1,020 flower photographs cannot improve on them.</text>
</svg>
