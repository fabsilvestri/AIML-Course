<svg width="1080" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <text class="t-hd" x="22" y="28" fill="#c0392b">Twelve applications, twelve things that broke first</text>
  <text class="t-sub" x="22" y="50">the red line is the measurement that failed; the method arrived afterwards</text>

  <!-- row 1 -->
  <rect class="box-r" x="20"  y="68" width="250" height="94" rx="7"/>
  <text class="t-sub" x="34" y="90">1&#8211;2 &#183; housing prices</text>
  <text class="t" x="34" y="114" fill="#c0392b">scaled before splitting,</text>
  <text class="t" x="34" y="136" fill="#c0392b">scored on the training set</text>
  <text class="t-sub" x="34" y="156">&#8594; pipelines, cross-validation</text>

  <rect class="box-r" x="286" y="68" width="250" height="94" rx="7"/>
  <text class="t-sub" x="300" y="90">3&#8211;4 &#183; rare-event detector</text>
  <text class="t" x="300" y="114" fill="#c0392b">96.9% accurate, and it</text>
  <text class="t" x="300" y="136" fill="#c0392b">missed 22.8% of the fives</text>
  <text class="t-sub" x="300" y="156">&#8594; precision, recall, thresholds</text>

  <rect class="box-r" x="552" y="68" width="250" height="94" rx="7"/>
  <text class="t-sub" x="566" y="90">5&#8211;6 &#183; survival probabilities</text>
  <text class="t" x="566" y="114" fill="#c0392b">degree 5 fit the training</text>
  <text class="t" x="566" y="136" fill="#c0392b">set and nothing else</text>
  <text class="t-sub" x="566" y="156">&#8594; bias&#8211;variance, ridge, lasso</text>

  <rect class="box-r" x="818" y="68" width="242" height="94" rx="7"/>
  <text class="t-sub" x="832" y="90">7&#8211;8 &#183; land cover</text>
  <text class="t" x="832" y="114" fill="#c0392b">one tree, refit, gives a</text>
  <text class="t" x="832" y="136" fill="#c0392b">different explanation</text>
  <text class="t-sub" x="832" y="156">&#8594; bagging, forests, extra-trees</text>

  <!-- row 2 -->
  <rect class="box-r" x="20"  y="180" width="250" height="94" rx="7"/>
  <text class="t-sub" x="34" y="202">9&#8211;10 &#183; face grouping</text>
  <text class="t" x="34" y="226" fill="#c0392b">4,096 dimensions, and a</text>
  <text class="t" x="34" y="248" fill="#c0392b">sweep that took a minute</text>
  <text class="t-sub" x="34" y="268">&#8594; SVD, PCA, projection</text>

  <rect class="box-r" x="286" y="180" width="250" height="94" rx="7"/>
  <text class="t-sub" x="300" y="202">11&#8211;12 &#183; document sorting</text>
  <text class="t" x="300" y="226" fill="#c0392b">a loop you cannot open,</text>
  <text class="t" x="300" y="248" fill="#c0392b">and two silent bugs</text>
  <text class="t-sub" x="300" y="268">&#8594; PyTorch, autograd, eval()</text>

  <rect class="box-r" x="552" y="180" width="250" height="94" rx="7"/>
  <text class="t-sub" x="566" y="202">13&#8211;14 &#183; deep recognition</text>
  <text class="t" x="566" y="226" fill="#c0392b">twenty layers, and the</text>
  <text class="t" x="566" y="248" fill="#c0392b">signal died on the way</text>
  <text class="t-sub" x="566" y="268">&#8594; initialisation, normalisation</text>

  <rect class="box-r" x="818" y="180" width="242" height="94" rx="7"/>
  <text class="t-sub" x="832" y="202">15&#8211;16 &#183; visual inspection</text>
  <text class="t" x="832" y="226" fill="#c0392b">from scratch, on far too</text>
  <text class="t" x="832" y="248" fill="#c0392b">few labelled images</text>
  <text class="t-sub" x="832" y="268">&#8594; transfer learning, freezing</text>

  <!-- row 3 -->
  <rect class="box-r" x="20"  y="292" width="250" height="94" rx="7"/>
  <text class="t-sub" x="34" y="314">17&#8211;18 &#183; object detection</text>
  <text class="t" x="34" y="338" fill="#c0392b">a visibly wrong box, and</text>
  <text class="t" x="34" y="360" fill="#c0392b">no number for how wrong</text>
  <text class="t-sub" x="34" y="380">&#8594; IoU, GIoU, average precision</text>

  <rect class="box-r" x="286" y="292" width="250" height="94" rx="7"/>
  <text class="t-sub" x="300" y="314">19&#8211;20 &#183; demand forecasting</text>
  <text class="t" x="300" y="338" fill="#c0392b">a random split across</text>
  <text class="t" x="300" y="360" fill="#c0392b">time: you forecast the past</text>
  <text class="t-sub" x="300" y="380">&#8594; stationarity, backtesting</text>

  <rect class="box-r" x="552" y="292" width="250" height="94" rx="7"/>
  <text class="t-sub" x="566" y="314">21&#8211;22 &#183; customer feedback</text>
  <text class="t" x="566" y="338" fill="#c0392b">embeddings learned from</text>
  <text class="t" x="566" y="360" fill="#c0392b">one small labelled corpus</text>
  <text class="t-sub" x="566" y="380">&#8594; pretraining, fine-tuning</text>

  <rect class="box-m" x="812" y="292" width="250" height="94" rx="7"/>
  <text class="t-sub" x="826" y="314">23&#8211;24 &#183; the catalogue</text>
  <text class="t" x="826" y="338" fill="#6c3483">two encoders, two spaces,</text>
  <text class="t" x="826" y="360" fill="#6c3483">and nothing between them</text>
  <text class="t-sub" x="826" y="380">&#8594; the contrastive objective</text>
</svg>
