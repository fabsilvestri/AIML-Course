<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 486" width="1080" height="486" font-family="'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,Helvetica,sans-serif">
  <defs>
    <marker id="c-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
  </defs>

  <!-- outer: the Pipeline -->
  <rect x="14" y="58" width="1052" height="330" rx="7" fill="#fbfcfd" stroke="#0b3d62" stroke-width="3"/>
  <rect x="34" y="44" width="180" height="30" rx="7" fill="#0b3d62"/>
  <text x="124" y="65" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff" letter-spacing="0.5">Pipeline</text>

  <!-- inner: the ColumnTransformer -->
  <rect x="196" y="96" width="470" height="256" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5" stroke-dasharray="8 5"/>
  <rect x="216" y="82" width="230" height="28" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text x="331" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">ColumnTransformer</text>

  <!-- raw input -->
  <rect x="40" y="188" width="130" height="72" rx="7" fill="#ffffff" stroke="#0b3d62" stroke-width="2"/>
  <text x="105" y="214" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">raw</text>
  <text x="105" y="234" text-anchor="middle" font-size="19" fill="#33414d">DataFrame</text>
  <text x="105" y="252" text-anchor="middle" font-size="16" fill="#4b5563">9 num + 1 cat</text>

  <path d="M 172 208 L 214 158" stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#c-ar)"/>
  <path d="M 172 240 L 214 290" stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#c-ar)"/>

  <!-- numeric branch -->
  <rect x="218" y="126" width="426" height="66" rx="7" fill="#ffffff" stroke="#0b3d62" stroke-width="2"/>
  <text x="234" y="150" font-size="16" font-weight="700" fill="#4b5563" letter-spacing="1">NUMERIC COLUMNS</text>
  <rect x="234" y="158" width="182" height="26" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="1.5"/>
  <text x="325" y="176" text-anchor="middle" font-size="16" fill="#0b3d62">SimpleImputer(median)</text>
  <path d="M 420 171 L 442 171" stroke="#0b3d62" stroke-width="2" fill="none" marker-end="url(#c-ar)"/>
  <rect x="446" y="158" width="182" height="26" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="1.5"/>
  <text x="537" y="176" text-anchor="middle" font-size="16" fill="#0b3d62">StandardScaler</text>

  <!-- categorical branch -->
  <rect x="218" y="256" width="426" height="66" rx="7" fill="#ffffff" stroke="#0b3d62" stroke-width="2"/>
  <text x="234" y="280" font-size="16" font-weight="700" fill="#4b5563" letter-spacing="1">CATEGORICAL COLUMN</text>
  <rect x="234" y="288" width="394" height="26" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="1.5"/>
  <text x="431" y="306" text-anchor="middle" font-size="16" fill="#0b3d62">OneHotEncoder(handle_unknown="ignore")</text>

  <!-- join -->
  <path d="M 648 159 L 690 205" stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#c-ar)"/>
  <path d="M 648 289 L 690 243" stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#c-ar)"/>

  <rect x="694" y="190" width="140" height="68" rx="7" fill="#ffffff" stroke="#0b3d62" stroke-width="2"/>
  <text x="764" y="216" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">concatenate</text>
  <text x="764" y="240" text-anchor="middle" font-size="16" fill="#33414d">one matrix</text>

  <path d="M 838 224 L 878 224" stroke="#0b3d62" stroke-width="2.5" fill="none" marker-end="url(#c-ar)"/>

  <rect x="882" y="182" width="164" height="84" rx="7" fill="#eef4f8" stroke="#0b3d62" stroke-width="2.5"/>
  <text x="964" y="212" text-anchor="middle" font-size="19" font-weight="700" fill="#0b3d62">the model</text>
  <text x="964" y="236" text-anchor="middle" font-size="16" fill="#33414d">RandomForest,</text>
  <text x="964" y="254" text-anchor="middle" font-size="16" fill="#33414d">LinearRegression, …</text>

  <!-- why it matters -->
  <rect x="14" y="398" width="1052" height="80" rx="7" fill="#eff8f2" stroke="#14663a" stroke-width="2.5"/>
  <text x="540" y="424" text-anchor="middle" font-size="19" font-weight="700" fill="#14663a">
    Why the whole thing must be one object
  </text>
  <text x="540" y="446" text-anchor="middle" font-size="19" fill="#16212b">
    cross_val_score refits the <tspan font-weight="700">entire</tspan> pipeline on each fold&#8217;s training part
  </text>
  <text x="540" y="470" text-anchor="middle" font-size="19" fill="#16212b">
    &#8212; so the imputer&#8217;s median and the scaler&#8217;s mean never see the validation fold
  </text>
</svg>
