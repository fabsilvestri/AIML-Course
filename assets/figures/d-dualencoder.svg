<svg width="1080" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3d62"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
  </defs>

  <!-- ============================ LEFT: two spaces ====================== -->
  <text class="t-hd" x="24" y="30" fill="#c0392b">Trained apart</text>
  <text class="t-sub" x="24" y="52">two encoders, two spaces, no shared coordinate</text>

  <rect class="box" x="24" y="80" width="112" height="58" rx="7"/>
  <text class="t" x="80" y="106" text-anchor="middle">image</text>
  <text class="t-sub" x="80" y="126" text-anchor="middle">catalogue entry</text>

  <rect class="box" x="24" y="248" width="112" height="58" rx="7"/>
  <text class="t" x="80" y="274" text-anchor="middle">text</text>
  <text class="t-sub" x="80" y="294" text-anchor="middle">the query</text>

  <path class="flow" d="M 136 109 L 178 109" stroke="#0b3d62" marker-end="url(#ar)"/>
  <path class="flow" d="M 136 277 L 178 277" stroke="#0b3d62" marker-end="url(#ar)"/>

  <rect class="box" x="182" y="80" width="132" height="58" rx="7"/>
  <text class="t" x="248" y="105" text-anchor="middle">ViT-B/16</text>
  <text class="t-sub" x="248" y="125" text-anchor="middle">ImageNet labels</text>

  <rect class="box" x="182" y="248" width="132" height="58" rx="7"/>
  <text class="t" x="248" y="273" text-anchor="middle">MiniLM-L6</text>
  <text class="t-sub" x="248" y="293" text-anchor="middle">sentence pairs</text>

  <path class="flow" d="M 314 109 L 356 109" stroke="#0b3d62" marker-end="url(#ar)"/>
  <path class="flow" d="M 314 277 L 356 277" stroke="#0b3d62" marker-end="url(#ar)"/>

  <ellipse cx="424" cy="109" rx="66" ry="42" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text class="t" x="424" y="105" text-anchor="middle">image space</text>
  <text class="t-sub" x="424" y="126" text-anchor="middle">768 dimensions</text>

  <ellipse cx="424" cy="277" rx="66" ry="42" fill="#eef4f8" stroke="#0b3d62" stroke-width="2"/>
  <text class="t" x="424" y="273" text-anchor="middle">text space</text>
  <text class="t-sub" x="424" y="294" text-anchor="middle">384 dimensions</text>

  <path class="flow" d="M 424 151 L 424 235" stroke="#c0392b" stroke-dasharray="9 7"
        marker-end="url(#ar-r)" marker-start="url(#ar-r)"/>
  <text class="t" x="440" y="188" fill="#c0392b">cosine of what,</text>
  <text class="t" x="440" y="210" fill="#c0392b">against what?</text>

  <rect class="box-r" x="24" y="342" width="466" height="58" rx="7"/>
  <text class="t" x="40" y="366" fill="#c0392b">Same object, two vectors</text>
  <text class="t-sub" x="40" y="388">— and no closer together than two vectors of different objects.</text>

  <!-- divider -->
  <path d="M 528 60 L 528 400" stroke="#b0bcc7" stroke-width="2"/>

  <!-- ============================ RIGHT: one space ====================== -->
  <text class="t-hd" x="566" y="30" fill="#14663a">Trained together</text>
  <text class="t-sub" x="566" y="52">one objective pulls matching pairs together and pushes the rest apart</text>

  <rect class="box" x="566" y="80" width="112" height="58" rx="7"/>
  <text class="t" x="622" y="106" text-anchor="middle">image</text>
  <text class="t-sub" x="622" y="126" text-anchor="middle">catalogue entry</text>

  <rect class="box" x="566" y="248" width="112" height="58" rx="7"/>
  <text class="t" x="622" y="274" text-anchor="middle">text</text>
  <text class="t-sub" x="622" y="294" text-anchor="middle">the query</text>

  <path class="flow" d="M 678 109 L 716 109" stroke="#14663a" marker-end="url(#ar-g)"/>
  <path class="flow" d="M 678 277 L 716 277" stroke="#14663a" marker-end="url(#ar-g)"/>

  <rect class="box-g" x="720" y="80" width="126" height="58" rx="7"/>
  <text class="t" x="783" y="105" text-anchor="middle">image tower</text>
  <text class="t-sub" x="783" y="125" text-anchor="middle">ViT-B/32</text>

  <rect class="box-g" x="720" y="248" width="126" height="58" rx="7"/>
  <text class="t" x="783" y="273" text-anchor="middle">text tower</text>
  <text class="t-sub" x="783" y="293" text-anchor="middle">12-layer transformer</text>

  <path class="flow" d="M 846 109 L 908 150" stroke="#14663a" marker-end="url(#ar-g)"/>
  <path class="flow" d="M 846 277 L 908 236" stroke="#14663a" marker-end="url(#ar-g)"/>

  <circle cx="978" cy="193" r="68" fill="#eef4f8" stroke="#14663a" stroke-width="2.5"/>
  <text class="t" x="978" y="182" text-anchor="middle">one sphere</text>
  <text class="t-sub" x="978" y="203" text-anchor="middle">512 dimensions</text>
  <text class="t-sub" x="978" y="222" text-anchor="middle">both modalities</text>

  <rect class="box-m" x="566" y="342" width="490" height="58" rx="7"/>
  <text class="t" x="582" y="366" fill="#6c3483">The projection heads are the whole trick</text>
  <text class="t-sub" x="582" y="388">Two linear maps, trained by one contrastive loss, into one shared coordinate system.</text>
</svg>
