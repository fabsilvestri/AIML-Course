<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400"
     font-family="'Source Sans 3','Source Sans Pro',Helvetica,sans-serif">
  <style>
    .box   { fill:#fff; stroke:#0b3d62; stroke-width:2; }
    .box-r { fill:#fff; stroke:#c0392b; stroke-width:2; }
    .box-g { fill:#fff; stroke:#14663a; stroke-width:2; }
    .box-m { fill:#fff; stroke:#6c3483; stroke-width:2; }
    .t     { font-size:19px; fill:#16212b; }
    .t-sub { font-size:16px; fill:#4b5563; }
    .t-hd  { font-size:23px; font-weight:700; }
    .flow  { stroke-width:2.5; fill:none; }
  </style>
  <defs>
    <marker id="cr-arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14663a"/>
    </marker>
    <marker id="cr-arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text class="t-hd" x="16" y="28" fill="#0b3d62">Two shapes, two diagnoses, two different repairs</text>

  <!-- ============================ left panel: bias ============================ -->
  <text class="t" x="70" y="58" font-weight="700" fill="#0b3d62">Both curves plateau high, and together</text>
  <line x1="70" y1="78" x2="100" y2="78" stroke="#0b3d62" stroke-width="2.5"/>
  <text class="t-sub" x="108" y="83">training folds</text>
  <line x1="222" y1="78" x2="252" y2="78" stroke="#c0392b" stroke-width="2.5"/>
  <text class="t-sub" x="260" y="83">held-out folds</text>

  <line x1="70" y1="300" x2="70" y2="96" stroke="#7b8794" stroke-width="2"/>
  <line x1="70" y1="300" x2="490" y2="300" stroke="#7b8794" stroke-width="2"/>
  <text class="t-sub" x="64" y="104" text-anchor="end" transform="rotate(-90 64 104)">error</text>
  <text class="t-sub" x="490" y="322" text-anchor="end">training passengers &#8594;</text>

  <line x1="70" y1="268" x2="490" y2="268" stroke="#6c3483" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t-sub" x="486" y="288" text-anchor="end" fill="#6c3483">irreducible error</text>

  <path class="flow" d="M 82 292 C 150 292 190 190 270 180 S 400 174 484 172" stroke="#0b3d62"/>
  <path class="flow" d="M 82 118 C 150 118 190 158 270 168 S 400 164 484 162" stroke="#c0392b"/>

  <path class="flow" d="M 446 176 L 446 262" stroke="#14663a" marker-start="url(#cr-arG)" marker-end="url(#cr-arG)"/>
  <text class="t-sub" x="436" y="214" text-anchor="end" fill="#14663a">this height is bias&#178;</text>

  <rect class="box" x="70" y="336" width="420" height="54" rx="7"/>
  <text class="t-sub" x="84" y="358"><tspan fill="#c0392b" font-weight="700">Bias.</tspan>
    <tspan fill="#16212b">&#160;More data will not move either curve.</tspan></text>
  <text class="t-sub" x="84" y="379">Repair: more features, higher degree, weaker penalty.</text>

  <!-- ========================== right panel: variance ========================= -->
  <text class="t" x="610" y="58" font-weight="700" fill="#0b3d62">A gap that does not close</text>
  <line x1="610" y1="78" x2="640" y2="78" stroke="#0b3d62" stroke-width="2.5"/>
  <text class="t-sub" x="648" y="83">training folds</text>
  <line x1="762" y1="78" x2="792" y2="78" stroke="#c0392b" stroke-width="2.5"/>
  <text class="t-sub" x="800" y="83">held-out folds</text>

  <line x1="610" y1="300" x2="610" y2="96" stroke="#7b8794" stroke-width="2"/>
  <line x1="610" y1="300" x2="1030" y2="300" stroke="#7b8794" stroke-width="2"/>
  <text class="t-sub" x="604" y="104" text-anchor="end" transform="rotate(-90 604 104)">error</text>
  <text class="t-sub" x="1030" y="322" text-anchor="end">training passengers &#8594;</text>

  <line x1="610" y1="268" x2="1030" y2="268" stroke="#6c3483" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t-sub" x="616" y="256" fill="#6c3483">irreducible error</text>

  <path class="flow" d="M 622 294 C 700 292 780 288 860 286 S 980 283 1024 282" stroke="#0b3d62"/>
  <path class="flow" d="M 622 112 C 700 118 780 146 860 164 S 980 182 1024 188" stroke="#c0392b"/>

  <path class="flow" d="M 968 192 L 968 278" stroke="#c0392b" marker-start="url(#cr-arR)" marker-end="url(#cr-arR)"/>
  <text class="t-sub" x="958" y="228" text-anchor="end" fill="#c0392b">still open at the last point</text>

  <rect class="box" x="610" y="336" width="420" height="54" rx="7"/>
  <text class="t-sub" x="624" y="358"><tspan fill="#c0392b" font-weight="700">Variance.</tspan>
    <tspan fill="#16212b">&#160;More data would help, and is not on offer.</tspan></text>
  <text class="t-sub" x="624" y="379">Repair: shrink the model &#8212; ridge, lasso, early stopping.</text>
</svg>
